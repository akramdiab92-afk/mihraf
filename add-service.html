<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إضافة خدمة | مِهراف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 92%;
      max-width: 850px;
      margin: auto;
    }

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      color: #2563eb;
      font-size: 28px;
      font-weight: 800;
    }

    .back-btn {
      background: #eff6ff;
      color: #2563eb;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 14px;
    }

    main {
      padding: 40px 0;
    }

    .form-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 30px;
    }

    .form-header {
      margin-bottom: 28px;
    }

    .form-header h1 {
      font-size: 27px;
      color: #111827;
      margin-bottom: 8px;
    }

    .form-header p {
      color: #6b7280;
      font-size: 14px;
      line-height: 1.7;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    input,
    textarea,
    select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 12px 13px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      background: white;
      color: #111827;
    }

    input:focus,
    textarea:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.08);
    }

    textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.7;
    }

    .price-wrapper {
      position: relative;
    }

    .price-wrapper input {
      padding-left: 65px;
    }

    .currency {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: #6b7280;
      font-size: 13px;
      pointer-events: none;
    }

    #message {
      display: none;
      padding: 12px 14px;
      border-radius: 9px;
      margin-bottom: 20px;
      font-size: 14px;
      line-height: 1.6;
    }

    #message.success {
      display: block;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
    }

    #message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .submit-btn {
      width: 100%;
      border: none;
      background: #2563eb;
      color: white;
      padding: 13px 20px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .submit-btn:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    #loading {
      text-align: center;
      padding: 80px 20px;
      color: #6b7280;
    }

    #content {
      display: none;
    }

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #9ca3af;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .form-card {
        padding: 22px;
      }

      .form-header h1 {
        font-size: 23px;
      }

      .nav {
        min-height: 62px;
      }

      .logo {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container nav">

    <a href="index.html" class="logo">
      مِهراف
    </a>

    <a href="dashboard.html" class="back-btn">
      لوحة التحكم
    </a>

  </div>
</header>

<div id="loading">
  جاري التحقق من الحساب...
</div>

<main id="content">

  <div class="container">

    <div class="form-card">

      <div class="form-header">

        <h1>
          أضف خدمتك 🚀
        </h1>

        <p>
          اعرض مهارتك أمام العملاء على منصة مِهراف.
          اكتب وصفًا واضحًا للخدمة وحدد السعر المناسب.
        </p>

      </div>

      <div id="message"></div>

      <form id="serviceForm">

        <div class="form-group">

          <label for="title">
            عنوان الخدمة
          </label>

          <input
            type="text"
            id="title"
            name="title"
            placeholder="مثال: تصميم شعار احترافي"
            maxlength="120"
            required
          >

        </div>

        <div class="form-group">

          <label for="description">
            وصف الخدمة
          </label>

          <textarea
            id="description"
            name="description"
            placeholder="اشرح للعميل بالتفصيل ماذا سيحصل عليه عند طلب خدمتك..."
            maxlength="3000"
            required
          ></textarea>

        </div>

        <div class="form-group">

          <label for="category">
            التصنيف
          </label>

          <select
            id="category"
            name="category"
            required
          >

            <option value="">
              اختر تصنيف الخدمة
            </option>

            <option value="التصميم">
              🎨 التصميم
            </option>

            <option value="البرمجة">
              💻 البرمجة والتطوير
            </option>

            <option value="الكتابة">
              ✍️ الكتابة والترجمة
            </option>

            <option value="التسويق">
              📢 التسويق الرقمي
            </option>

            <option value="الفيديو">
              🎬 الفيديو والرسوم المتحركة
            </option>

            <option value="الصوت">
              🎙️ الصوتيات
            </option>

            <option value="الأعمال">
              📊 الأعمال والاستشارات
            </option>

            <option value="أخرى">
              📦 أخرى
            </option>

          </select>

        </div>

        <div class="form-group">

          <label for="price">
            سعر الخدمة
          </label>

          <div class="price-wrapper">

            <input
              type="number"
              id="price"
              name="price"
              placeholder="مثال: 25"
              min="1"
              step="0.01"
              required
            >

            <span class="currency">
              دولار
            </span>

          </div>

        </div>

        <button
          type="submit"
          class="submit-btn"
          id="submitBtn"
        >
          نشر الخدمة
        </button>

      </form>

    </div>

  </div>

</main>

<footer>
  © 2026 MIHRAF — مِهراف
</footer>

<script>

  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("content");

  const message =
    document.getElementById("message");

  const form =
    document.getElementById("serviceForm");

  const submitBtn =
    document.getElementById("submitBtn");


  function showMessage(text, type) {

    message.textContent = text;
    message.className = type;
    message.style.display = "block";

  }


  async function checkUser() {

    try {

      const response =
        await fetch(
          "/api/me",
          {
            method: "GET",
            credentials: "include",
            cache: "no-store"
          }
        );


      const raw =
        await response.text();

      let data = {};

      try {

        data = JSON.parse(raw);

      } catch (error) {

        data = {
          success: false,
          message: raw || "استجابة غير صالحة من الخادم."
        };

      }


      const isLoggedIn =
        (
          data.logged_in === true ||
          data.authenticated === true
        ) &&
        !!data.user;


      if (
        !response.ok ||
        !data.success ||
        !isLoggedIn
      ) {

        window.location.href =
          "login.html";

        return;

      }


      if (
        data.user.role !== "freelancer"
      ) {

        loading.style.display =
          "none";

        content.style.display =
          "block";

        showMessage(
          "هذه الصفحة مخصصة للمستقلين فقط.",
          "error"
        );

        form.style.display =
          "none";

        return;

      }


      loading.style.display =
        "none";

      content.style.display =
        "block";


    } catch (error) {

      console.error(
        "Check user error:",
        error
      );

      loading.style.display =
        "none";

      content.style.display =
        "block";

      showMessage(
        "تعذر الاتصال بالخادم. حاول مرة أخرى.",
        "error"
      );

    }

  }


  form.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const title =
        document
          .getElementById("title")
          .value
          .trim();


      const description =
        document
          .getElementById("description")
          .value
          .trim();


      const category =
        document
          .getElementById("category")
          .value
          .trim();


      const price =
        Number(
          document
            .getElementById("price")
            .value
        );


      if (
        title.length < 3
      ) {

        showMessage(
          "عنوان الخدمة يجب أن يكون 3 أحرف على الأقل.",
          "error"
        );

        return;

      }


      if (
        description.length < 10
      ) {

        showMessage(
          "وصف الخدمة يجب أن يكون 10 أحرف على الأقل.",
          "error"
        );

        return;

      }


      if (!category) {

        showMessage(
          "اختر تصنيف الخدمة.",
          "error"
        );

        return;

      }


      if (
        !Number.isFinite(price) ||
        price <= 0
      ) {

        showMessage(
          "أدخل سعرًا صحيحًا أكبر من صفر.",
          "error"
        );

        return;

      }


      submitBtn.disabled =
        true;

      submitBtn.textContent =
        "جاري نشر الخدمة...";

      message.style.display =
        "none";


      try {

        const response =
          await fetch(
            "/api/services",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              credentials:
                "include",

              body:
                JSON.stringify({
                  title:
                    title,

                  description:
                    description,

                  category:
                    category,

                  price:
                    price
                })
            }
          );


        /*
          نقرأ الرد كنص أولا.
          هذا يمنع response.json()
          من إخفاء الخطأ الحقيقي إذا
          رجع الخادم HTML أو رد غير JSON.
        */

        const raw =
          await response.text();


        let data = {};


        try {

          data =
            JSON.parse(raw);

        } catch (error) {

          data = {
            success: false,
            message:
              raw ||
              `خطأ من الخادم (${response.status})`
          };

        }


        if (
          !response.ok ||
          !data.success
        ) {

          showMessage(
            data.message ||
            data.error ||
            `حدث خطأ من الخادم (${response.status})`,
            "error"
          );

          return;

        }


        showMessage(
          data.message ||
          "تم نشر الخدمة بنجاح.",
          "success"
        );


        form.reset();


        setTimeout(
          function() {

            window.location.href =
              "my-services.html";

          },
          1000
        );


      } catch (error) {

        console.error(
          "Create service error:",
          error
        );

        showMessage(
          "تعذر الاتصال بالخادم. حاول مرة أخرى.",
          "error"
        );

      } finally {

        submitBtn.disabled =
          false;

        submitBtn.textContent =
          "نشر الخدمة";

      }

    }
  );


  checkUser();

</script>

</body>
</html>
