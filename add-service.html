<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>إضافة خدمة | مِهراف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      min-height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #2563eb;
    }

    .back-link {
      color: #4b5563;
      font-size: 14px;
    }

    .back-link:hover {
      color: #2563eb;
    }

    .container {
      max-width: 850px;
      margin: auto;
      padding: 35px 20px 60px;
    }

    .page-title {
      margin-bottom: 25px;
    }

    .page-title h1 {
      font-size: 30px;
      color: #111827;
      margin-bottom: 8px;
    }

    .page-title p {
      color: #6b7280;
      line-height: 1.8;
      font-size: 14px;
    }

    .card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.03);
    }

    .field {
      margin-bottom: 20px;
    }

    .field label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 8px;
    }

    .field input,
    .field textarea,
    .field select {
      width: 100%;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      padding: 12px;
      font-family: inherit;
      font-size: 14px;
      color: #111827;
      background: #fff;
      outline: none;
    }

    .field textarea {
      min-height: 150px;
      resize: vertical;
      line-height: 1.8;
    }

    .field input:focus,
    .field textarea:focus,
    .field select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #dbeafe;
    }

    .hint {
      color: #6b7280;
      font-size: 12px;
      margin-top: 6px;
      line-height: 1.6;
    }

    .error {
      display: none;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #be123c;
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 20px;
      line-height: 1.8;
      font-size: 14px;
    }

    .success {
      display: none;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
      border-radius: 10px;
      padding: 13px;
      margin-bottom: 20px;
      line-height: 1.8;
      font-size: 14px;
    }

    .buttons {
      display: flex;
      gap: 10px;
      margin-top: 25px;
    }

    .submit-btn,
    .cancel-btn {
      border-radius: 9px;
      padding: 13px 20px;
      font-family: inherit;
      font-size: 14px;
      cursor: pointer;
    }

    .submit-btn {
      flex: 1;
      border: none;
      background: #2563eb;
      color: #fff;
    }

    .submit-btn:hover {
      background: #1d4ed8;
    }

    .submit-btn:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .cancel-btn {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #4b5563;
    }

    .cancel-btn:hover {
      background: #f9fafb;
    }

    .loading {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 45px 20px;
      text-align: center;
      color: #6b7280;
    }

    .loader {
      width: 38px;
      height: 38px;
      border: 4px solid #e5e7eb;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin .8s linear infinite;
      margin: 0 auto 15px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .hidden {
      display: none !important;
    }

    .footer {
      border-top: 1px solid #e5e7eb;
      background: #fff;
      text-align: center;
      padding: 22px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .header-inner {
        min-height: auto;
        padding: 14px 20px;
      }

      .container {
        padding: 25px 15px 45px;
      }

      .card {
        padding: 20px;
      }

      .page-title h1 {
        font-size: 25px;
      }

      .buttons {
        flex-direction: column;
      }

      .submit-btn,
      .cancel-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">

    <a href="index.html" class="logo">
      مِهراف
    </a>

    <a href="dashboard.html" class="back-link">
      ← العودة إلى لوحة التحكم
    </a>

  </div>
</header>

<main class="container">

  <div id="loading" class="loading">
    <div class="loader"></div>
    جاري التحقق من الحساب...
  </div>

  <div id="content" class="hidden">

    <div class="page-title">
      <h1>إضافة خدمة</h1>

      <p>
        أضف خدمة جديدة إلى مِهراف ليتمكن العملاء من الاطلاع عليها وطلبها منك.
      </p>
    </div>

    <div class="card">

      <div id="errorMessage" class="error"></div>

      <div id="successMessage" class="success"></div>

      <form id="serviceForm">

        <div class="field">

          <label for="title">
            عنوان الخدمة
          </label>

          <input
            type="text"
            id="title"
            name="title"
            maxlength="150"
            required
            placeholder="مثال: تصميم شعار احترافي"
          >

        </div>

        <div class="field">

          <label for="description">
            وصف الخدمة
          </label>

          <textarea
            id="description"
            name="description"
            maxlength="5000"
            required
            placeholder="اشرح للعميل بالتفصيل ماذا تقدم في هذه الخدمة..."
          ></textarea>

          <div class="hint">
            اكتب وصفا واضحا للخدمة وما الذي سيحصل عليه العميل.
          </div>

        </div>

        <div class="field">

          <label for="category">
            التصنيف
          </label>

          <select
            id="category"
            name="category"
            required
          >

            <option value="">
              اختر تصنيف الخدمة
            </option>

            <option value="تصميم">
              تصميم
            </option>

            <option value="برمجة">
              برمجة
            </option>

            <option value="كتابة وترجمة">
              كتابة وترجمة
            </option>

            <option value="تسويق">
              تسويق
            </option>

            <option value="فيديو وصوتيات">
              فيديو وصوتيات
            </option>

            <option value="تعليم وتدريب">
              تعليم وتدريب
            </option>

            <option value="استشارات">
              استشارات
            </option>

            <option value="أعمال وخدمات">
              أعمال وخدمات
            </option>

            <option value="أخرى">
              أخرى
            </option>

          </select>

        </div>

        <div class="field">

          <label for="price">
            سعر الخدمة بالدولار
          </label>

          <input
            type="number"
            id="price"
            name="price"
            min="0"
            step="0.01"
            required
            placeholder="مثال: 25"
          >

        </div>

        <div class="buttons">

          <button
            type="submit"
            id="submitButton"
            class="submit-btn"
          >
            إضافة الخدمة
          </button>

          <button
            type="button"
            class="cancel-btn"
            onclick="window.location.href='dashboard.html'"
          >
            إلغاء
          </button>

        </div>

      </form>

    </div>

  </div>

</main>

<footer class="footer">
  © 2026 مِهراف | MIHRAF - منصة الخدمات والمشاريع
</footer>

<script>

  const loading =
    document.getElementById("loading");

  const content =
    document.getElementById("content");

  const serviceForm =
    document.getElementById("serviceForm");

  const errorMessage =
    document.getElementById("errorMessage");

  const successMessage =
    document.getElementById("successMessage");

  const submitButton =
    document.getElementById("submitButton");


  function showError(message) {

    errorMessage.textContent =
      message || "حدث خطأ.";

    errorMessage.style.display =
      "block";

    successMessage.style.display =
      "none";
  }


  function showSuccess(message) {

    successMessage.textContent =
      message || "تمت العملية بنجاح.";

    successMessage.style.display =
      "block";

    errorMessage.style.display =
      "none";
  }


  async function checkAuth() {

    try {

      const response =
        await fetch(
          "/api/me",
          {
            method: "GET",
            credentials: "include",
            headers: {
              "Accept": "application/json"
            }
          }
        );

      if (!response.ok) {

        window.location.href =
          "login.html";

        return false;
      }

      const data =
        await response.json();

      /*
       * الحساب في مِهراف موحد.
       * لا يوجد أي شرط يعتمد على role.
       */

      if (!data || !data.user) {

        window.location.href =
          "login.html";

        return false;
      }

      loading.style.display =
        "none";

      content.classList.remove(
        "hidden"
      );

      return true;

    } catch (error) {

      console.error(
        "Auth error:",
        error
      );

      loading.style.display =
        "none";

      content.classList.remove(
        "hidden"
      );

      showError(
        "تعذر الاتصال بالخادم. حاول مرة أخرى."
      );

      return false;
    }

  }


  serviceForm.addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      errorMessage.style.display =
        "none";

      successMessage.style.display =
        "none";

      const title =
        document.getElementById(
          "title"
        ).value.trim();

      const description =
        document.getElementById(
          "description"
        ).value.trim();

      const category =
        document.getElementById(
          "category"
        ).value.trim();

      const price =
        document.getElementById(
          "price"
        ).value.trim();


      if (!title) {

        showError(
          "يرجى إدخال عنوان الخدمة."
        );

        return;
      }


      if (!description) {

        showError(
          "يرجى إدخال وصف الخدمة."
        );

        return;
      }


      if (!category) {

        showError(
          "يرجى اختيار تصنيف الخدمة."
        );

        return;
      }


      if (
        price === "" ||
        !Number.isFinite(
          Number(price)
        ) ||
        Number(price) < 0
      ) {

        showError(
          "يرجى إدخال سعر صحيح للخدمة."
        );

        return;
      }


      submitButton.disabled =
        true;

      submitButton.textContent =
        "جاري إضافة الخدمة...";


      try {

        const response =
          await fetch(
            "/api/services",
            {
              method: "POST",

              credentials: "include",

              headers: {
                "Content-Type":
                  "application/json",

                "Accept":
                  "application/json"
              },

              body: JSON.stringify({
                title:
                  title,

                description:
                  description,

                category:
                  category,

                price:
                  Number(price)
              })
            }
          );


        let data = null;

        try {

          data =
            await response.json();

        } catch {

          data = null;

        }


        if (
          response.status === 401
        ) {

          window.location.href =
            "login.html";

          return;
        }


        if (
          !response.ok ||
          !data ||
          data.success !== true
        ) {

          const error =
            data &&
            (
              data.error ||
              data.message
            )
              ? (
                  data.error ||
                  data.message
                )
              : "تعذر إضافة الخدمة.";

          throw new Error(
            error
          );
        }


        showSuccess(
          data.message ||
          "تمت إضافة الخدمة بنجاح."
        );


        serviceForm.reset();


        setTimeout(
          function() {

            window.location.href =
              "my-services.html";

          },
          1000
        );


      } catch (error) {

        console.error(
          "Create service error:",
          error
        );

        showError(
          error.message ||
          "حدث خطأ أثناء إضافة الخدمة."
        );

        submitButton.disabled =
          false;

        submitButton.textContent =
          "إضافة الخدمة";
      }

    }
  );


  checkAuth();

</script>

</body>
</html>
