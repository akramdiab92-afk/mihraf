<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="إدارة المشاريع التي قمت بنشرها على منصة مِهراف.">
  <title>مشاريعي | مِهراف</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #111827;
      --muted: #6b7280;
      --border: #e5e7eb;
      --blue: #2563eb;
      --blue-dark: #1d4ed8;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --success: #166534;
      --success-bg: #dcfce7;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.7;
      min-height: 100vh;
    }

    a {
      color: inherit;
    }

    header {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: 16px 20px;
    }

    .header-content {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: var(--text);
      text-decoration: none;
    }

    .logo span {
      color: var(--blue);
    }

    .back-btn {
      text-decoration: none;
      color: #374151;
      background: #f3f4f6;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 14px;
    }

    .back-btn:hover {
      background: #e5e7eb;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px 60px;
    }

    .page-title {
      margin-bottom: 25px;
    }

    .page-title h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .page-title p {
      color: var(--muted);
    }

    .message {
      display: none;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 15px;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      display: block;
      background: var(--success-bg);
      color: var(--success);
    }

    .loading {
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 50px 20px;
      color: var(--muted);
    }

    .empty {
      display: none;
      text-align: center;
      background: var(--card);
      border-radius: 14px;
      padding: 50px 20px;
      border: 1px solid var(--border);
    }

    .empty .icon {
      font-size: 45px;
      margin-bottom: 15px;
    }

    .empty h2 {
      margin-bottom: 8px;
    }

    .empty p {
      color: var(--muted);
      margin-bottom: 20px;
    }

    .primary-btn {
      display: inline-block;
      border: none;
      background: var(--blue);
      color: white;
      padding: 11px 18px;
      border-radius: 8px;
      text-decoration: none;
      cursor: pointer;
      font-size: 15px;
      font-family: inherit;
    }

    .primary-btn:hover {
      background: var(--blue-dark);
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
    }

    .project-card h2 {
      font-size: 21px;
      margin-bottom: 10px;
      color: #111827;
      line-height: 1.5;
    }

    .description {
      color: #4b5563;
      margin-bottom: 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .details {
      display: grid;
      gap: 9px;
      margin-bottom: 18px;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid #f0f0f0;
    }

    .detail span:first-child {
      color: var(--muted);
    }

    .detail span:last-child {
      font-weight: bold;
      text-align: left;
    }

    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    .status.open {
      background: #dcfce7;
      color: #166534;
    }

    .status.in_progress {
      background: #dbeafe;
      color: #1e40af;
    }

    .status.completed {
      background: #ede9fe;
      color: #5b21b6;
    }

    .status.cancelled {
      background: #fee2e2;
      color: #991b1b;
    }

    .status.reserved {
      background: #f3f4f6;
      color: #4b5563;
    }

    .status.unknown {
      background: #f3f4f6;
      color: #4b5563;
    }

    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .edit-btn,
    .delete-btn {
      border: none;
      padding: 9px 14px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 14px;
      font-family: inherit;
    }

    .edit-btn {
      background: #eff6ff;
      color: #1d4ed8;
    }

    .edit-btn:hover {
      background: #dbeafe;
    }

    .delete-btn {
      background: var(--danger-bg);
      color: var(--danger);
    }

    .delete-btn:hover {
      background: #fee2e2;
    }

    .details-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--blue);
      color: #fff;
      text-decoration: none;
      padding: 10px 14px;
      border-radius: 8px;
      margin-top: 10px;
      font-size: 14px;
    }

    .details-btn:hover {
      background: var(--blue-dark);
    }

    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.5);
      z-index: 1000;
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: #ffffff;
      max-width: 600px;
      margin: 40px auto;
      border-radius: 14px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .modal-header h2 {
      font-size: 22px;
    }

    .close-btn {
      border: none;
      background: transparent;
      font-size: 28px;
      cursor: pointer;
      color: #6b7280;
    }

    .form-group {
      margin-bottom: 17px;
    }

    .form-group label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    .form-group input,
    .form-group textarea,
    .form-group select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      outline: none;
    }

    .form-group input:focus,
    .form-group textarea:focus,
    .form-group select:focus {
      border-color: var(--blue);
    }

    .form-group textarea {
      min-height: 140px;
      resize: vertical;
    }

    .modal-actions {
      display: flex;
      gap: 10px;
      margin-top: 20px;
    }

    .cancel-btn {
      border: none;
      background: #f3f4f6;
      color: #374151;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }

    .cancel-btn:hover {
      background: #e5e7eb;
    }

    .retry-btn {
      margin-top: 15px;
      border: none;
      background: var(--blue);
      color: #fff;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-family: inherit;
    }

    .retry-btn:hover {
      background: var(--blue-dark);
    }

    @media (max-width: 600px) {
      .header-content {
        flex-direction: column;
        align-items: stretch;
      }

      .back-btn {
        text-align: center;
      }

      .page-title h1 {
        font-size: 25px;
      }

      .project-card {
        padding: 18px;
      }

      .detail {
        flex-direction: column;
        gap: 2px;
      }

      .detail span:last-child {
        text-align: right;
      }
    }
  </style></head><body><header>
  <div class="header-content">
    <a href="index.html" class="logo">مِهراف<span>.</span></a><a href="dashboard.html" class="back-btn">
  ← العودة إلى لوحة التحكم
</a>

  </div>
</header><main>  <div class="page-title">
    <h1>مشاريعي</h1>
    <p>إدارة المشاريع التي قمت بنشرها على منصة مهراف.</p>
  </div>  <div id="message" class="message"></div>  <div id="loading" class="loading">
    جارٍ تحميل مشاريعك...
  </div>  <div id="empty" class="empty"><div class="icon">📁</div>

<h2>لا توجد مشاريع بعد</h2>

<p>
  لم تقم بنشر أي مشروع حتى الآن.
</p>

<a
  href="add-project.html"
  class="primary-btn"
>
  ➕ نشر مشروع جديد
</a>

  </div>  <div id="projects" class="projects"></div></main><div id="editModal" class="modal">  <div class="modal-content"><div class="modal-header">

  <h2>تعديل المشروع</h2>

  <button
    class="close-btn"
    type="button"
    onclick="closeModal()"
  >
    ×
  </button>

</div>

<form id="editForm">

  <div class="form-group">

    <label for="editTitle">
      عنوان المشروع
    </label>

    <input
      type="text"
      id="editTitle"
      maxlength="120"
      required
    >

  </div>

  <div class="form-group">

    <label for="editDescription">
      وصف المشروع
    </label>

    <textarea
      id="editDescription"
      maxlength="3000"
      required
    ></textarea>

  </div>

  <div class="form-group">

    <label for="editCategory">
      التصنيف
    </label>

    <select
      id="editCategory"
      required
    >
      <option value="">
        اختر التصنيف
      </option>

      <option value="التصميم">
        التصميم
      </option>

      <option value="البرمجة">
        البرمجة
      </option>

      <option value="الكتابة">
        الكتابة
      </option>

      <option value="التسويق">
        التسويق
      </option>

      <option value="الفيديو">
        الفيديو
      </option>

      <option value="الصوت">
        الصوت
      </option>

      <option value="الأعمال">
        الأعمال
      </option>

      <option value="أخرى">
        أخرى
      </option>

    </select>

  </div>

  <div class="form-group">

    <label for="editBudget">
      الميزانية بالدولار
    </label>

    <input
      type="number"
      id="editBudget"
      min="1"
      step="0.01"
      required
    >

  </div>

  <div id="editMessage" class="message"></div>

  <div class="modal-actions">

    <button
      type="submit"
      class="primary-btn"
    >
      حفظ التعديلات
    </button>

    <button
      type="button"
      class="cancel-btn"
      onclick="closeModal()"
    >
      إلغاء
    </button>

  </div>

</form>

  </div></div><script>

  let currentProjectId = null;
  let myProjects = [];

  const loading =
    document.getElementById("loading");

  const projectsContainer =
    document.getElementById("projects");

  const empty =
    document.getElementById("empty");

  const message =
    document.getElementById("message");

  const editModal =
    document.getElementById("editModal");


  const statusNames = {
    open: "مفتوح",
    reserved: "محجوز",
    in_progress: "قيد التنفيذ",
    completed: "مكتمل",
    cancelled: "ملغى"
  };


  function escapeHTML(value) {

    if (
      value === null ||
      value === undefined
    ) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function showMessage(
    text,
    type = "error"
  ) {

    message.textContent =
      text || "";

    message.className =
      "message " + type;
  }


  function clearMessage() {

    message.textContent = "";

    message.className =
      "message";
  }


  function showEditMessage(
    text,
    type = "error"
  ) {

    const element =
      document.getElementById(
        "editMessage"
      );

    element.textContent =
      text || "";

    element.className =
      "message " + type;
  }


  function clearEditMessage() {

    const element =
      document.getElementById(
        "editMessage"
      );

    element.textContent = "";

    element.className =
      "message";
  }


  function formatDate(
    dateString
  ) {

    if (!dateString) {
      return "-";
    }

    const normalized =
      String(dateString)
        .replace(" ", "T");

    const date =
      new Date(normalized);

    if (
      Number.isNaN(
        date.getTime()
      )
    ) {
      return escapeHTML(
        dateString
      );
    }

    return date.toLocaleDateString(
      "ar-EG",
      {
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    );
  }


  async function checkAuth() {

    try {

      const response =
        await fetch(
          "/api/me",
          {
            method: "GET",
            credentials: "include",
            cache: "no-store",
            headers: {
              "Accept":
                "application/json"
            }
          }
        );

      const rawText =
        await response.text();

      let data = null;

      try {

        data =
          JSON.parse(
            rawText
          );

      } catch (error) {

        console.error(
          "Invalid /api/me response:",
          rawText
        );

        showMessage(
          "استجابة الخادم غير صالحة."
        );

        loading.style.display =
          "none";

        return false;
      }


      if (
        response.status === 401 ||
        !response.ok
      ) {

        window.location.href =
          "login.html?redirect=" +
          encodeURIComponent(
            "my-projects"
          );

        return false;
      }


      if (
        data.authenticated === false ||
        !data.user
      ) {

        window.location.href =
          "login.html?redirect=" +
          encodeURIComponent(
            "my-projects"
          );

        return false;
      }


      /*
       * مِهراف يستخدم حسابا موحدا.
       * لا نمنع المستخدم بناء على role.
       */

      return true;

    } catch (error) {

      console.error(
        "Auth error:",
        error
      );

      loading.style.display =
        "none";

      showMessage(
        "تعذر الاتصال بالخادم. حاول مرة أخرى."
      );

      return false;
    }
  }


  async function loadProjects() {

    clearMessage();

    loading.style.display =
      "block";

    empty.style.display =
      "none";

    projectsContainer.innerHTML =
      "";


    try {

      const response =
        await fetch(
          "/api/my-projects",
          {
            method: "GET",
            credentials: "include",
            cache: "no-store",
            headers: {
              "Accept":
                "application/json"
            }
          }
        );


      const rawText =
        await response.text();

      let data;

      try {

        data =
          JSON.parse(
            rawText
          );

      } catch (parseError) {

        console.error(
          "Invalid /api/my-projects response:",
          rawText
        );

        throw new Error(
          "استجابة الخادم غير صالحة."
        );
      }


      console.log(
        "My Projects API:",
        response.status,
        data
      );


      if (
        response.status === 401
      ) {

        window.location.href =
          "login.html?redirect=" +
          encodeURIComponent(
            "my-projects"
          );

        return;
      }


      if (
        !response.ok ||
        data.success !== true
      ) {

        throw new Error(
          data.error ||
          data.message ||
          "تعذر تحميل المشاريع."
        );
      }


      myProjects =
        Array.isArray(
          data.projects
        )
          ? data.projects
          : [];


      loading.style.display =
        "none";


      if (
        myProjects.length === 0
      ) {

        empty.style.display =
          "block";

        return;
      }


      projectsContainer.innerHTML =
        myProjects
          .map(
            project =>
              createProjectCard(
                project
              )
          )
          .join("");


    } catch (error) {

      console.error(
        "My projects error:",
        error
      );

      loading.style.display =
        "none";

      projectsContainer.innerHTML =
        "";

      showMessage(
        error.message ||
        "حدث خطأ أثناء تحميل المشاريع. حاول مرة أخرى."
      );
    }
  }


  function normalizeStatus(
    project
  ) {

    const status =
      String(
        project.status ||
        "open"
      )
        .toLowerCase()
        .trim();

    if (
      status === "in-progress" ||
      status === "inprogress"
    ) {
      return "in_progress";
    }

    return status;
  }


  function createProjectCard(
    project
  ) {

    const status =
      normalizeStatus(
        project
      );

    const canEdit =
      status === "open";


    const title =
      escapeHTML(
        project.title ||
        "مشروع بدون عنوان"
      );

    const description =
      escapeHTML(
        project.description ||
        "لا يوجد وصف للمشروع."
      );

    const category =
      escapeHTML(
        project.category ||
        "أخرى"
      );


    const numericBudget =
      Number(
        project.budget
      );

    const budget =
      Number.isFinite(
        numericBudget
      )
        ? "$" +
          numericBudget.toFixed(2)
        : "$0.00";


    const statusText =
      statusNames[status] ||
      "غير معروف";


    const projectId =
      Number(
        project.id
      );


    return `
      <article class="project-card">

        <h2>
          ${title}
        </h2>

        <div class="description">
          ${description}
        </div>

        <div class="details">

          <div class="detail">
            <span>التصنيف</span>
            <span>
              ${category}
            </span>
          </div>

          <div class="detail">
            <span>الميزانية</span>
            <span>
              ${budget}
            </span>
          </div>

          <div class="detail">
            <span>الحالة</span>

            <span
              class="status ${escapeHTML(
                status
              )}"
            >
              ${escapeHTML(
                statusText
              )}
            </span>
          </div>

          <div class="detail">
            <span>تاريخ النشر</span>

            <span>
              ${formatDate(
                project.created_at
              )}
            </span>
          </div>

        </div>


        ${
          canEdit
            ? `
              <div class="actions">

                <button
                  type="button"
                  class="edit-btn"
                  onclick="openEditModal(${projectId})"
                >
                  ✏️ تعديل
                </button>

                <button
                  type="button"
                  class="delete-btn"
                  onclick="deleteProject(${projectId})"
                >
                  🗑️ إلغاء المشروع
                </button>

              </div>
            `
            : `
              <div
                style="
                  color:#6b7280;
                  font-size:14px;
                  margin-bottom:10px;
                "
              >
                لا يمكن تعديل هذا المشروع بعد تغيير حالته.
              </div>
            `
        }


        ${
          Number.isFinite(
            projectId
          )
            ? `
              <a
                class="details-btn"
                href="project-details.html?id=${encodeURIComponent(
                  projectId
                )}"
              >
                👁️ عرض تفاصيل المشروع
              </a>
            `
            : ""
        }

      </article>
    `;
  }


  async function openEditModal(
    projectId
  ) {

    clearEditMessage();

    const project =
      myProjects.find(
        item =>
          Number(item.id) ===
          Number(projectId)
      );


    if (!project) {

      showMessage(
        "المشروع غير موجود."
      );

      return;
    }


    if (
      normalizeStatus(
        project
      ) !== "open"
    ) {

      showMessage(
        "لا يمكن تعديل هذا المشروع لأنه لم يعد مفتوحا."
      );

      return;
    }


    currentProjectId =
      project.id;


    document.getElementById(
      "editTitle"
    ).value =
      project.title || "";


    document.getElementById(
      "editDescription"
    ).value =
      project.description || "";


    document.getElementById(
      "editCategory"
    ).value =
      project.category || "";


    document.getElementById(
      "editBudget"
    ).value =
      project.budget || "";


    editModal.style.display =
      "block";
  }


  function closeModal() {

    editModal.style.display =
      "none";

    currentProjectId =
      null;

    clearEditMessage();
  }


  document
    .getElementById(
      "editForm"
    )
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        if (!currentProjectId) {
          return;
        }


        const title =
          document
            .getElementById(
              "editTitle"
            )
            .value
            .trim();


        const description =
          document
            .getElementById(
              "editDescription"
            )
            .value
            .trim();


        const category =
          document
            .getElementById(
              "editCategory"
            )
            .value;


        const budget =
          Number(
            document
              .getElementById(
                "editBudget"
              )
              .value
          );


        if (
          title.length < 3
        ) {

          showEditMessage(
            "عنوان المشروع يجب أن يكون 3 أحرف على الأقل."
          );

          return;
        }


        if (
          description.length < 10
        ) {

          showEditMessage(
            "وصف المشروع يجب أن يكون 10 أحرف على الأقل."
          );

          return;
        }


        if (!category) {

          showEditMessage(
            "يرجى اختيار التصنيف."
          );

          return;
        }


        if (
          !Number.isFinite(
            budget
          ) ||
          budget <= 0
        ) {

          showEditMessage(
            "يرجى إدخال ميزانية صحيحة."
          );

          return;
        }


        const submitButton =
          this.querySelector(
            'button[type="submit"]'
          );


        submitButton.disabled =
          true;

        submitButton.textContent =
          "جارٍ الحفظ...";


        clearEditMessage();


        try {

          const response =
            await fetch(
              "/api/projects/" +
              encodeURIComponent(
                currentProjectId
              ),
              {
                method: "PUT",

                headers: {
                  "Content-Type":
                    "application/json",
                  "Accept":
                    "application/json"
                },

                credentials: "include",

                body:
                  JSON.stringify({
                    title,
                    description,
                    category,
                    budget
                  })
              }
            );


          const rawText =
            await response.text();

          let data = {};

          try {

            data =
              JSON.parse(
                rawText
              );

          } catch (error) {

            throw new Error(
              "استجابة الخادم غير صالحة."
            );
          }


          if (
            response.status === 401
          ) {

            window.location.href =
              "login.html?redirect=" +
              encodeURIComponent(
                "my-projects"
              );

            return;
          }


          if (
            !response.ok ||
            data.success === false
          ) {

            throw new Error(
              data.error ||
              data.message ||
              "تعذر حفظ التعديلات."
            );
          }


          closeModal();


          showMessage(
            "تم تعديل المشروع بنجاح.",
            "success"
          );


          await loadProjects();


        } catch (error) {

          console.error(
            "Update project error:",
            error
          );

          showEditMessage(
            error.message ||
            "حدث خطأ أثناء حفظ التعديلات."
          );


        } finally {

          submitButton.disabled =
            false;

          submitButton.textContent =
            "حفظ التعديلات";
        }

      }
    );


  async function deleteProject(
    projectId
  ) {

    const confirmed =
      confirm(
        "هل أنت متأكد من إلغاء هذا المشروع؟\n\n" +
        "سيتم تغيير حالته إلى «ملغى» ولن تتمكن من تعديله بعد ذلك."
      );


    if (!confirmed) {
      return;
    }


    clearMessage();


    try {

      const response =
        await fetch(
          "/api/projects/" +
          encodeURIComponent(
            projectId
          ),
          {
            method: "DELETE",
            credentials: "include",
            headers: {
              "Accept":
                "application/json"
            }
          }
        );


      const rawText =
        await response.text();

      let data = {};

      try {

        data =
          JSON.parse(
            rawText
          );

      } catch (error) {

        throw new Error(
          "استجابة الخادم غير صالحة."
        );
      }


      if (
        response.status === 401
      ) {

        window.location.href =
          "login.html?redirect=" +
          encodeURIComponent(
            "my-projects"
          );

        return;
      }


      if (
        !response.ok ||
        data.success === false
      ) {

        throw new Error(
          data.error ||
          data.message ||
          "تعذر إلغاء المشروع."
        );
      }


      showMessage(
        "تم إلغاء المشروع بنجاح.",
        "success"
      );


      await loadProjects();


    } catch (error) {

      console.error(
        "Delete project error:",
        error
      );

      showMessage(
        error.message ||
        "حدث خطأ أثناء إلغاء المشروع."
      );
    }
  }


  window.addEventListener(
    "click",
    function(event) {

      if (
        event.target ===
        editModal
      ) {
        closeModal();
      }

    }
  );


  async function init() {

    const authenticated =
      await checkAuth();


    if (
      authenticated
    ) {

      await loadProjects();
    }
  }


  init();

</script></body>
</html>
