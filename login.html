<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تسجيل الدخول | مِهراف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .logo {
      text-align: center;
      margin-bottom: 25px;
    }

    .logo a {
      text-decoration: none;
      color: #2563eb;
      font-size: 34px;
      font-weight: 800;
    }

    .logo p {
      margin-top: 8px;
      color: #6b7280;
      font-size: 15px;
    }

    .login-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.08);
      border: 1px solid #e5e7eb;
    }

    .login-card h1 {
      text-align: center;
      font-size: 25px;
      margin-bottom: 8px;
      color: #111827;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 28px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
      font-weight: 700;
      color: #374151;
    }

    input {
      width: 100%;
      height: 50px;
      padding: 0 15px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: #fff;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-left: 55px;
    }

    .show-password {
      position: absolute;
      left: 10px;
      top: 50%;
      transform: translateY(-50%);
      border: none;
      background: transparent;
      color: #6b7280;
      cursor: pointer;
      font-size: 13px;
      padding: 8px;
    }

    .show-password:hover {
      color: #2563eb;
    }

    .login-button {
      width: 100%;
      height: 52px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 5px;
    }

    .login-button:hover {
      background: #1d4ed8;
    }

    .login-button:disabled {
      background: #93c5fd;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: 9px;
      font-size: 14px;
      line-height: 1.6;
    }

    .message.error {
      display: block;
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
    }

    .message.success {
      display: block;
      background: #f0fdf4;
      color: #15803d;
      border: 1px solid #bbf7d0;
    }

    .register-link {
      text-align: center;
      margin-top: 23px;
      color: #6b7280;
      font-size: 14px;
      line-height: 1.8;
    }

    .register-link a {
      color: #2563eb;
      text-decoration: none;
      font-weight: 700;
    }

    .register-link a:hover {
      text-decoration: underline;
    }

    .back-home {
      text-align: center;
      margin-top: 18px;
    }

    .back-home a {
      color: #6b7280;
      text-decoration: none;
      font-size: 13px;
    }

    .back-home a:hover {
      color: #2563eb;
    }

    @media (max-width: 480px) {
      body {
        padding: 15px;
      }

      .login-card {
        padding: 26px 20px;
      }

      .logo a {
        font-size: 30px;
      }
    }
  </style>
</head>

<body>

  <div class="login-container">

    <div class="logo">
      <a href="index.html">مِهراف</a>
      <p>منصة الخدمات والمشاريع</p>
    </div>

    <div class="login-card">

      <h1>تسجيل الدخول</h1>

      <p class="subtitle">
        سجل دخولك للوصول إلى حسابك
      </p>

      <div id="message" class="message"></div>

      <form id="loginForm">

        <div class="form-group">
          <label for="email">البريد الإلكتروني</label>

          <input
            type="email"
            id="email"
            name="email"
            placeholder="example@email.com"
            autocomplete="email"
            required
          >
        </div>

        <div class="form-group">
          <label for="password">كلمة المرور</label>

          <div class="password-wrapper">

            <input
              type="password"
              id="password"
              name="password"
              placeholder="أدخل كلمة المرور"
              autocomplete="current-password"
              required
            >

            <button
              type="button"
              class="show-password"
              id="showPassword"
            >
              إظهار
            </button>

          </div>
        </div>

        <button
          type="submit"
          class="login-button"
          id="loginButton"
        >
          تسجيل الدخول
        </button>

      </form>

      <div class="register-link">

        <a href="forgot-password.html">
          نسيت كلمة المرور؟
        </a>

        <br><br>

        ليس لديك حساب؟
        <a href="register.html">
          إنشاء حساب جديد
        </a>

      </div>

      <div class="back-home">
        <a href="index.html">
          ← العودة إلى الصفحة الرئيسية
        </a>
      </div>

    </div>

  </div>

  <script>

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginButton =
      document.getElementById("loginButton");

    const message =
      document.getElementById("message");

    const showPassword =
      document.getElementById("showPassword");


    showPassword.addEventListener("click", () => {

      if (passwordInput.type === "password") {

        passwordInput.type = "text";
        showPassword.textContent = "إخفاء";

      } else {

        passwordInput.type = "password";
        showPassword.textContent = "إظهار";

      }

    });


    function showMessage(text, type) {

      message.textContent = text;
      message.className = "message " + type;

    }


    loginForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      const email =
        emailInput.value.trim().toLowerCase();

      const password =
        passwordInput.value;


      if (!email || !password) {

        showMessage(
          "يرجى إدخال البريد الإلكتروني وكلمة المرور",
          "error"
        );

        return;
      }


      loginButton.disabled = true;
      loginButton.textContent =
        "جاري تسجيل الدخول...";

      message.className = "message";
      message.textContent = "";


      try {

        const response = await fetch("/api/login", {

          method: "POST",

          headers: {
            "Content-Type": "application/json"
          },

          credentials: "include",

          body: JSON.stringify({
            email: email,
            password: password
          })

        });


        let data = {};

        try {
          data = await response.json();
        } catch {
          data = {};
        }


        if (!response.ok || !data.success) {

          const errorMessage =
            data.error ||
            data.message ||
            `فشل تسجيل الدخول (رمز الخطأ ${response.status})`;

          showMessage(
            errorMessage,
            "error"
          );

          loginButton.disabled = false;
          loginButton.textContent =
            "تسجيل الدخول";

          return;
        }


        showMessage(
          data.message ||
          "تم تسجيل الدخول بنجاح، جارٍ تحويلك...",
          "success"
        );


        setTimeout(() => {

          window.location.href =
            "index.html";

        }, 700);


      } catch (error) {

        console.error(
          "Login error:",
          error
        );

        showMessage(
          "تعذر الاتصال بالخادم. حاول مرة أخرى.",
          "error"
        );

        loginButton.disabled = false;
        loginButton.textContent =
          "تسجيل الدخول";

      }

    });

  </script>

</body>
</html>
