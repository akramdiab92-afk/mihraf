<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تعيين كلمة مرور جديدة | مِهراف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      min-height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #2563eb;
      text-decoration: none;
    }

    .home-link {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: auto;
      padding: 35px 20px;
    }

    .box {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,.04);
    }

    h1 {
      font-size: 25px;
      color: #111827;
      margin-bottom: 12px;
    }

    .description {
      color: #6b7280;
      line-height: 1.8;
      font-size: 14px;
      margin-bottom: 25px;
    }

    .field {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #dbeafe;
    }

    .password-input {
      direction: ltr;
      text-align: left;
    }

    button {
      width: 100%;
      margin-top: 5px;
      border: none;
      background: #2563eb;
      color: #fff;
      padding: 13px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      line-height: 1.8;
      font-size: 13px;
    }

    .success {
      display: block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .error {
      display: block;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #be123c;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .footer {
      border-top: 1px solid #e5e7eb;
      background: #fff;
      text-align: center;
      padding: 22px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .box {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">مِهراف</a>
    <a href="index.html" class="home-link">الرئيسية</a>
  </div>
</header>

<main class="container">

  <div class="box">

    <h1>تعيين كلمة مرور جديدة</h1>

    <p class="description">
      أدخل كلمة المرور الجديدة لحسابك.
      يجب أن تكون 8 أحرف أو أرقام على الأقل.
    </p>

    <form id="resetForm">

      <div class="field">

        <label for="password">
          كلمة المرور الجديدة
        </label>

        <input
          id="password"
          class="password-input"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="أدخل كلمة المرور الجديدة"
          required
        >

      </div>

      <div class="field">

        <label for="confirmPassword">
          تأكيد كلمة المرور
        </label>

        <input
          id="confirmPassword"
          class="password-input"
          type="password"
          autocomplete="new-password"
          minlength="8"
          placeholder="أعد كتابة كلمة المرور"
          required
        >

      </div>

      <button
        id="submitButton"
        type="submit"
      >
        تغيير كلمة المرور
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="login.html" class="back">
      العودة إلى تسجيل الدخول
    </a>

  </div>

</main>

<footer class="footer">
  © 2026 مِهراف | MIHRAF - منصة الخدمات والمشاريع
</footer>

<script>

  const form =
    document.getElementById("resetForm");

  const passwordInput =
    document.getElementById("password");

  const confirmPasswordInput =
    document.getElementById("confirmPassword");

  const submitButton =
    document.getElementById("submitButton");

  const message =
    document.getElementById("message");

  const params =
    new URLSearchParams(
      window.location.search
    );

  const token =
    params.get("token");

  if (!token) {

    showMessage(
      "رابط إعادة تعيين كلمة المرور غير صالح أو ناقص.",
      false
    );

    submitButton.disabled = true;
  }

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    if (!token) {
      return;
    }

    const password =
      passwordInput.value;

    const confirmPassword =
      confirmPasswordInput.value;

    if (password.length < 8) {

      showMessage(
        "كلمة المرور يجب أن تكون 8 أحرف أو أرقام على الأقل.",
        false
      );

      return;
    }

    if (password !== confirmPassword) {

      showMessage(
        "كلمتا المرور غير متطابقتين.",
        false
      );

      return;
    }

    submitButton.disabled = true;

    submitButton.textContent =
      "جاري تغيير كلمة المرور...";

    message.className = "message";
    message.textContent = "";

    try {

      const response =
        await fetch(
          "/api/reset-password",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body: JSON.stringify({
              token: token,
              password: password
            })
          }
        );

      const data =
        await response.json();

      if (!response.ok || !data.success) {

        throw new Error(
          data.error ||
          "تعذر تغيير كلمة المرور."
        );

      }

      showMessage(
        data.message ||
        "تم تغيير كلمة المرور بنجاح.",
        true
      );

      passwordInput.disabled = true;
      confirmPasswordInput.disabled = true;

      submitButton.style.display = "none";

      setTimeout(function() {

        window.location.href =
          "login.html";

      }, 2500);

    } catch (error) {

      console.error(
        "Reset password:",
        error
      );

      showMessage(
        error.message ||
        "حدث خطأ أثناء تغيير كلمة المرور.",
        false
      );

      submitButton.disabled = false;

      submitButton.textContent =
        "تغيير كلمة المرور";

    }

  });

  function showMessage(text, success) {

    message.textContent = text;

    message.className =
      success
        ? "message success"
        : "message error";

  }

</script>

</body>
</html>
