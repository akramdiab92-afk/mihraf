<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تفاصيل المشروع - مِهراف</title>  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 18px 20px;
    }

    .header-inner {
      max-width: 900px;
      margin: auto;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      color: #111827;
    }

    .back {
      text-decoration: none;
      color: #2563eb;
      font-weight: bold;
    }

    main {
      max-width: 900px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .loading,
    .error,
    .not-found {
      background: #ffffff;
      padding: 30px;
      border-radius: 14px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .error {
      color: #b91c1c;
    }

    .project {
      display: none;
    }

    .project-card {
      background: #ffffff;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.06);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 20px;
      color: #111827;
      font-size: 30px;
    }

    .description {
      background: #f9fafb;
      border-radius: 12px;
      padding: 20px;
      line-height: 1.9;
      white-space: pre-wrap;
      margin-bottom: 25px;
    }

    .details {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 25px;
    }

    .detail {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      background: #ffffff;
    }

    .detail-label {
      display: block;
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 7px;
    }

    .detail-value {
      font-weight: bold;
      font-size: 17px;
    }

    .budget {
      color: #15803d;
      font-size: 20px;
    }

    .status {
      display: inline-block;
      padding: 7px 12px;
      border-radius: 20px;
      background: #dcfce7;
      color: #166534;
      font-size: 14px;
    }

    .action {
      margin-top: 25px;
      padding-top: 25px;
      border-top: 1px solid #e5e7eb;
    }

    .proposal-btn {
      display: inline-block;
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: #ffffff;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      text-decoration: none;
      text-align: center;
    }

    .proposal-btn:hover {
      background: #1d4ed8;
    }

    .notice {
      margin-top: 12px;
      text-align: center;
      color: #6b7280;
      font-size: 14px;
    }

    @media (max-width: 600px) {
      .header-inner {
        flex-direction: column;
        align-items: flex-start;
      }

      .details {
        grid-template-columns: 1fr;
      }

      .project-card {
        padding: 20px;
      }

      h1 {
        font-size: 24px;
      }
    }
  </style></head><body><header>
  <div class="header-inner">
    <div class="logo">مِهراف</div><a href="projects.html" class="back">
  ← العودة إلى المشاريع
</a>

  </div>
</header><main>  <div id="loading" class="loading">
    جارٍ تحميل تفاصيل المشروع...
  </div>  <div id="error" class="error" style="display:none;"></div>  <div id="notFound" class="not-found" style="display:none;">
    <h2>المشروع غير موجود</h2>
    <p>قد يكون المشروع قد تم حذفه أو لم يعد متاحًا.</p>
    <a href="projects.html" class="back">
      العودة إلى المشاريع
    </a>
  </div>  <section id="project" class="project"><div class="project-card">

  <h1 id="title"></h1>

  <div class="description" id="description"></div>

  <div class="details">

    <div class="detail">
      <span class="detail-label">التصنيف</span>
      <span class="detail-value" id="category"></span>
    </div>

    <div class="detail">
      <span class="detail-label">الميزانية</span>
      <span class="detail-value budget" id="budget"></span>
    </div>

    <div class="detail">
      <span class="detail-label">صاحب المشروع</span>
      <span class="detail-value" id="client"></span>
    </div>

    <div class="detail">
      <span class="detail-label">تاريخ النشر</span>
      <span class="detail-value" id="date"></span>
    </div>

    <div class="detail">
      <span class="detail-label">حالة المشروع</span>
      <span class="status" id="status"></span>
    </div>

  </div>

  <div class="action">

    <a href="#" id="proposalButton" class="proposal-btn"
       onclick="return false;">
      تقديم عرض على المشروع
    </a>

    <div class="notice">
      سنفعّل تقديم العروض بعد اختبار صفحة تفاصيل المشروع.
    </div>

  </div>

</div>

  </section></main><script>

  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("error");
  const notFound = document.getElementById("notFound");
  const projectBox = document.getElementById("project");

  function escapeHTML(value) {
    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function formatDate(dateString) {

    if (!dateString) {
      return "-";
    }

    const date = new Date(dateString);

    if (isNaN(date.getTime())) {
      return dateString;
    }

    return date.toLocaleDateString("ar", {
      year: "numeric",
      month: "long",
      day: "numeric"
    });
  }

  function showError(text) {

    loading.style.display = "none";
    projectBox.style.display = "none";
    notFound.style.display = "none";

    errorBox.textContent = text;
    errorBox.style.display = "block";
  }

  async function loadProject() {

    const params = new URLSearchParams(window.location.search);
    const projectId = params.get("id");

    if (!projectId) {

      loading.style.display = "none";
      notFound.style.display = "block";

      return;
    }

    try {

      /*
       * حاليًا Worker لا يملك endpoint
       * لجلب مشروع واحد.
       *
       * لذلك نجلب قائمة المشاريع المفتوحة
       * ونبحث عن المشروع المطلوب داخلها.
       */

      const response = await fetch("/api/projects", {
        method: "GET",
        credentials: "include"
      });

      const data = await response.json();

      if (!response.ok) {
        showError(data.error || "تعذر تحميل المشروع.");
        return;
      }

      const projects = data.projects || [];

      const project = projects.find(
        item => String(item.id) === String(projectId)
      );

      loading.style.display = "none";

      if (!project) {
        notFound.style.display = "block";
        return;
      }

      document.getElementById("title").textContent =
        project.title || "";

      document.getElementById("description").textContent =
        project.description || "";

      document.getElementById("category").textContent =
        project.category || "-";

      document.getElementById("budget").textContent =
        "$" + Number(project.budget).toFixed(2);

      document.getElementById("client").textContent =
        project.client_name || "مستخدم";

      document.getElementById("date").textContent =
        formatDate(project.created_at);

      document.getElementById("status").textContent =
        "مفتوح";

      projectBox.style.display = "block";

    } catch (error) {

      showError(
        "حدث خطأ أثناء تحميل تفاصيل المشروع. حاول مرة أخرى."
      );

    }
  }

  loadProject();

</script></body>
</html>
