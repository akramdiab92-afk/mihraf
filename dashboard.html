<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>لوحة التحكم | مِهراف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    .container {
      width: 92%;
      max-width: 1150px;
      margin: auto;
    }

    /* Header */

    header {
      background: white;
      border-bottom: 1px solid #e5e7eb;
    }

    .nav {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      color: #2563eb;
      font-size: 28px;
      font-weight: 800;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .home-btn,
    .logout-btn {
      border: none;
      cursor: pointer;
      padding: 9px 14px;
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
    }

    .home-btn {
      background: #eff6ff;
      color: #2563eb;
    }

    .logout-btn {
      background: #f3f4f6;
      color: #374151;
    }

    .logout-btn:hover {
      background: #e5e7eb;
    }

    /* Main */

    main {
      padding: 45px 0;
    }

    .welcome {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 28px;
      margin-bottom: 25px;
    }

    .welcome h1 {
      font-size: 27px;
      margin-bottom: 8px;
      color: #111827;
    }

    .welcome p {
      color: #6b7280;
      font-size: 15px;
    }

    .role-badge {
      display: inline-block;
      margin-top: 15px;
      padding: 7px 13px;
      border-radius: 20px;
      background: #eff6ff;
      color: #2563eb;
      font-size: 13px;
      font-weight: 700;
    }

    /* Cards */

    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 18px;
    }

    .dashboard-card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 24px;
      transition: 0.2s;
    }

    .dashboard-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 25px rgba(0, 0, 0, 0.06);
    }

    .icon {
      font-size: 30px;
      margin-bottom: 12px;
    }

    .dashboard-card h3 {
      margin-bottom: 7px;
      color: #111827;
      font-size: 18px;
    }

    .dashboard-card p {
      color: #6b7280;
      font-size: 14px;
      margin-bottom: 17px;
    }

    .card-btn {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 13px;
    }

    .card-btn.disabled {
      background: #e5e7eb;
      color: #9ca3af;
      cursor: not-allowed;
    }

    /* Loading */

    #loading {
      text-align: center;
      padding: 80px 20px;
      color: #6b7280;
    }

    #dashboard {
      display: none;
    }

    /* Error */

    #error {
      display: none;
      text-align: center;
      padding: 80px 20px;
    }

    #error h2 {
      margin-bottom: 12px;
      color: #111827;
    }

    #error p {
      color: #6b7280;
      margin-bottom: 20px;
    }

    #error a {
      display: inline-block;
      background: #2563eb;
      color: white;
      padding: 11px 20px;
      border-radius: 9px;
    }

    /* Footer */

    footer {
      text-align: center;
      padding: 30px 15px;
      color: #9ca3af;
      font-size: 13px;
    }

    @media (max-width: 800px) {
      .dashboard-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 550px) {
      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .welcome {
        padding: 22px;
      }

      .welcome h1 {
        font-size: 23px;
      }

      .nav-actions {
        gap: 5px;
      }

      .home-btn,
      .logout-btn {
        padding: 8px 10px;
        font-size: 13px;
      }
    }
  </style>
</head>

<body>

  <!-- Header -->

  <header>

    <div class="container nav">

      <a
        href="index.html"
        class="logo"
      >
        مِهراف
      </a>

      <div class="nav-actions">

        <a
          href="index.html"
          class="home-btn"
        >
          الرئيسية
        </a>

        <button
          type="button"
          class="logout-btn"
          onclick="logoutUser()"
        >
          تسجيل الخروج
        </button>

      </div>

    </div>

  </header>


  <!-- Loading -->

  <div id="loading">
    جاري تحميل لوحة التحكم...
  </div>


  <!-- Error -->

  <div id="error">

    <h2>
      يجب تسجيل الدخول أولًا
    </h2>

    <p>
      هذه الصفحة متاحة للمستخدمين المسجلين فقط.
    </p>

    <a href="login.html">
      تسجيل الدخول
    </a>

  </div>


  <!-- Dashboard -->

  <main id="dashboard">

    <div class="container">

      <!-- Welcome -->

      <div class="welcome">

        <h1>
          مرحبًا، <span id="userName"></span> 👋
        </h1>

        <p>
          أهلاً بك في لوحة تحكم مِهراف.
        </p>

        <span
          class="role-badge"
          id="userRole"
        >
        </span>

      </div>


      <!-- Dashboard Cards -->

      <div
        class="dashboard-grid"
        id="dashboardCards"
      >

        <!-- سيتم إنشاء البطاقات حسب نوع الحساب -->

      </div>

    </div>

  </main>


  <footer>
    © 2026 MIHRAF — مِهراف
  </footer>


  <script>

    // =========================
    // فحص المستخدم
    // =========================

    async function loadDashboard() {

      const loading =
        document.getElementById("loading");

      const dashboard =
        document.getElementById("dashboard");

      const error =
        document.getElementById("error");

      try {

        const response =
          await fetch("/api/me", {
            method: "GET",
            credentials: "include"
          });

        const data =
          await response.json();


        // المستخدم غير مسجل
        if (
          !response.ok ||
          !data.success ||
          !data.logged_in
        ) {

          loading.style.display = "none";
          error.style.display = "block";

          return;
        }


        // بيانات المستخدم
        const user =
          data.user;


        document.getElementById(
          "userName"
        ).textContent =
          user.full_name;


        // نوع الحساب
        const roleElement =
          document.getElementById("userRole");


        if (user.role === "client") {

          roleElement.textContent =
            "👤 حساب عميل";

        } else if (user.role === "freelancer") {

          roleElement.textContent =
            "💼 حساب مستقل";

        } else {

          roleElement.textContent =
            "حساب مستخدم";

        }


        // إنشاء البطاقات
        createDashboardCards(
          user.role
        );


        loading.style.display = "none";
        dashboard.style.display = "block";


      } catch (error) {

        console.error(error);

        loading.style.display = "none";
        error.style.display = "block";

      }

    }


    // =========================
    // بطاقات لوحة التحكم
    // =========================

    function createDashboardCards(role) {

      const container =
        document.getElementById(
          "dashboardCards"
        );


      if (role === "client") {

        container.innerHTML = `

          <div class="dashboard-card">

            <div class="icon">📋</div>

            <h3>
              مشاريعي
            </h3>

            <p>
              إدارة المشاريع التي نشرتها
              ومتابعة عروض المستقلين.
            </p>

            <a
              href="#"
              class="card-btn disabled"
            >
              قريبًا
            </a>

          </div>


          <div class="dashboard-card">

            <div class="icon">➕</div>

            <h3>
              نشر مشروع
            </h3>

            <p>
              أضف مشروعًا جديدًا وابحث
              عن الشخص المناسب لتنفيذه.
            </p>

            <a
              href="#"
              class="card-btn disabled"
            >
              قريبًا
            </a>

          </div>


          <div class="dashboard-card">

            <div class="icon">🛒</div>

            <h3>
              طلباتي
            </h3>

            <p>
              متابعة الخدمات التي طلبتها
              وحالة تنفيذها.
            </p>

            <a
              href="#"
              class="card-btn disabled"
            >
              قريبًا
            </a>

          </div>

        `;

      }


      else if (role === "freelancer") {

        container.innerHTML = `

          <div class="dashboard-card">

            <div class="icon">💼</div>

            <h3>
              خدماتي
            </h3>

            <p>
              إدارة الخدمات التي تقدمها
              للعملاء على مِهراف.
            </p>

            <a
              href="#"
              class="card-btn disabled"
            >
              قريبًا
            </a>

          </div>


          <div class="dashboard-card">

            <div class="icon">🔎</div>

            <h3>
              تصفح المشاريع
            </h3>

            <p>
              ابحث عن مشاريع مناسبة لمهاراتك
              وقدم عروضك عليها.
            </p>

            <a
              href="#"
              class="card-btn disabled"
            >
              قريبًا
            </a>

          </div>


          <div class="dashboard-card">

            <div class="icon">📦</div>

            <h3>
              طلبات العمل
            </h3>

            <p>
              تابع الأعمال والطلبات التي
              تعمل عليها حاليًا.
            </p>

            <a
              href="#"
              class="card-btn disabled"
            >
              قريبًا
            </a>

          </div>

        `;

      }


      else {

        container.innerHTML = `

          <div class="dashboard-card">

            <div class="icon">👤</div>

            <h3>
              حسابي
            </h3>

            <p>
              إدارة معلومات حسابك.
            </p>

            <a
              href="#"
              class="card-btn disabled"
            >
              قريبًا
            </a>

          </div>

        `;

      }

    }


    // =========================
    // تسجيل الخروج
    // =========================

    async function logoutUser() {

      try {

        const response =
          await fetch("/api/logout", {
            method: "POST",
            credentials: "include"
          });

        const data =
          await response.json();


        if (data.success) {

          window.location.href =
            "index.html";

        } else {

          alert(
            data.message ||
            "تعذر تسجيل الخروج"
          );

        }

      } catch (error) {

        console.error(error);

        alert(
          "تعذر الاتصال بالخادم"
        );

      }

    }


    // تشغيل لوحة التحكم
    loadDashboard();

  </script>

</body>

</html>
