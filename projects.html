<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>المشاريع - مهراف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #222;
      line-height: 1.7;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
    }

    .header-content {
      max-width: 1100px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #111827;
      text-decoration: none;
    }

    .logo span {
      color: #2563eb;
    }

    .back-btn {
      text-decoration: none;
      color: #374151;
      background: #f3f4f6;
      padding: 9px 15px;
      border-radius: 8px;
      font-size: 14px;
    }

    main {
      max-width: 1100px;
      margin: 35px auto;
      padding: 0 20px;
    }

    .page-title {
      margin-bottom: 25px;
    }

    .page-title h1 {
      font-size: 30px;
      margin-bottom: 6px;
    }

    .page-title p {
      color: #6b7280;
    }

    .toolbar {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 25px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .toolbar select {
      flex: 1;
      min-width: 200px;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: #fff;
    }

    .refresh-btn {
      border: none;
      background: #2563eb;
      color: #fff;
      padding: 11px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
    }

    .refresh-btn:hover {
      background: #1d4ed8;
    }

    .message {
      display: none;
      padding: 14px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .loading {
      text-align: center;
      padding: 50px 20px;
      color: #6b7280;
    }

    .empty {
      display: none;
      text-align: center;
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 50px 20px;
    }

    .empty .icon {
      font-size: 45px;
      margin-bottom: 12px;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    .project-card {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 22px;
      box-shadow: 0 3px 12px rgba(0, 0, 0, 0.04);
    }

    .project-card h2 {
      font-size: 21px;
      color: #111827;
      margin-bottom: 10px;
    }

    .description {
      color: #4b5563;
      margin-bottom: 18px;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .details {
      display: grid;
      gap: 9px;
      margin-bottom: 18px;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      padding-bottom: 7px;
      border-bottom: 1px solid #f0f0f0;
    }

    .detail span:first-child {
      color: #6b7280;
    }

    .detail span:last-child {
      font-weight: bold;
    }

    .category {
      display: inline-block;
      background: #eff6ff;
      color: #1d4ed8;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 13px;
    }

    .budget {
      color: #166534;
    }

    .date {
      color: #6b7280;
      font-size: 14px;
    }

    .view-btn {
      display: block;
      width: 100%;
      text-align: center;
      text-decoration: none;
      background: #2563eb;
      color: #fff;
      padding: 10px;
      border-radius: 8px;
      font-size: 15px;
      margin-top: 5px;
    }

    .view-btn:hover {
      background: #1d4ed8;
    }

    @media (max-width: 600px) {
      .header-content {
        flex-direction: column;
        align-items: stretch;
      }

      .back-btn {
        text-align: center;
      }

      .page-title h1 {
        font-size: 25px;
      }

      .project-card {
        padding: 18px;
      }

      .toolbar {
        flex-direction: column;
      }

      .toolbar select,
      .refresh-btn {
        width: 100%;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="header-content">
    <a href="index.html" class="logo">
      مِهراف<span>.</span>
    </a>

    <a href="dashboard.html" class="back-btn">
      ← العودة إلى لوحة التحكم
    </a>
  </div>
</header>

<main>

  <div class="page-title">
    <h1>تصفح المشاريع</h1>
    <p>اكتشف المشاريع المفتوحة وابحث عن فرصة مناسبة لمهاراتك.</p>
  </div>

  <div class="toolbar">

    <select id="categoryFilter">
      <option value="">جميع التصنيفات</option>
      <option value="التصميم">التصميم</option>
      <option value="البرمجة">البرمجة</option>
      <option value="الكتابة">الكتابة</option>
      <option value="التسويق">التسويق</option>
      <option value="الفيديو">الفيديو</option>
      <option value="الصوت">الصوت</option>
      <option value="الأعمال">الأعمال</option>
      <option value="أخرى">أخرى</option>
    </select>

    <button class="refresh-btn" onclick="loadProjects()">
      🔄 تحديث المشاريع
    </button>

  </div>

  <div id="message" class="message"></div>

  <div id="loading" class="loading">
    جارٍ تحميل المشاريع...
  </div>

  <div id="empty" class="empty">
    <div class="icon">📭</div>
    <h2>لا توجد مشاريع حاليًا</h2>
    <p>لم يتم العثور على مشاريع مفتوحة بهذا التصنيف.</p>
  </div>

  <div id="projects" class="projects"></div>

</main>

<script>

  const loading =
    document.getElementById("loading");

  const projectsContainer =
    document.getElementById("projects");

  const empty =
    document.getElementById("empty");

  const message =
    document.getElementById("message");

  const categoryFilter =
    document.getElementById("categoryFilter");


  function escapeHTML(value) {

    if (value === null || value === undefined) {
      return "";
    }

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }


  function formatDate(dateString) {

    if (!dateString) {
      return "-";
    }

    const date = new Date(dateString);

    if (isNaN(date.getTime())) {
      return dateString;
    }

    return date.toLocaleDateString("ar", {
      year: "numeric",
      month: "long",
      day: "numeric"
    });
  }


  function showError(text) {

    message.textContent = text;
    message.className = "message error";
  }


  function clearMessage() {

    message.textContent = "";
    message.className = "message";
  }


  async function loadProjects() {

    clearMessage();

    loading.style.display = "block";
    empty.style.display = "none";
    projectsContainer.innerHTML = "";

    const category =
      categoryFilter.value;

    let url = "/api/projects";

    if (category) {
      url += "?category=" +
        encodeURIComponent(category);
    }

    try {

      const response = await fetch(url, {
        method: "GET",
        credentials: "include"
      });

      const data = await response.json();

      loading.style.display = "none";

      if (!response.ok) {

        showError(
          data.error || "تعذر تحميل المشاريع."
        );

        return;
      }

      const projects =
        data.projects || [];

      if (projects.length === 0) {

        empty.style.display = "block";

        return;
      }

      projectsContainer.innerHTML =
        projects
          .map(project => createProjectCard(project))
          .join("");

    } catch (error) {

      loading.style.display = "none";

      showError(
        "حدث خطأ أثناء تحميل المشاريع. حاول مرة أخرى."
      );
    }
  }


  function createProjectCard(project) {

    return `
      <article class="project-card">

        <h2>
          ${escapeHTML(project.title)}
        </h2>

        <div class="description">
          ${escapeHTML(project.description)}
        </div>

        <div class="details">

          <div class="detail">
            <span>التصنيف</span>

            <span class="category">
              ${escapeHTML(project.category)}
            </span>
          </div>

          <div class="detail">
            <span>الميزانية</span>

            <span class="budget">
              $${Number(project.budget).toFixed(2)}
            </span>
          </div>

          <div class="detail">
            <span>صاحب المشروع</span>

            <span>
              ${escapeHTML(project.client_name || "مستخدم")}
            </span>
          </div>

          <div class="detail">
            <span>تاريخ النشر</span>

            <span class="date">
              ${formatDate(project.created_at)}
            </span>
          </div>

        </div>

        <a
          href="#"
          class="view-btn"
          onclick="return false;"
        >
          عرض تفاصيل المشروع
        </a>

      </article>
    `;
  }


  categoryFilter.addEventListener(
    "change",
    loadProjects
  );


  loadProjects();

</script>

</body>
</html>
