<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>تفاصيل المشروع | مِهراف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #181b20;
      color: #e7eaf0;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      position: sticky;
      top: 0;
      z-index: 10;
      height: 68px;
      background: #20242a;
      border-bottom: 1px solid #30363f;

      display: flex;
      align-items: center;
      justify-content: space-between;

      padding: 0 20px;
    }

    .logo {
      color: #4f8cff;
      font-size: 25px;
      font-weight: 800;
    }

    .back {
      background: #242930;
      border: 1px solid #30363f;
      padding: 10px 16px;
      border-radius: 10px;
      color: #e7eaf0;
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: 35px auto;
    }

    .loading,
    .error {
      background: #242930;
      border: 1px solid #30363f;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
    }

    .error {
      color: #ff8d8d;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 22px;
    }

    .card {
      background: #242930;
      border: 1px solid #30363f;
      border-radius: 18px;
      padding: 25px;
      margin-bottom: 22px;
    }

    .title {
      font-size: 30px;
      margin-bottom: 18px;
    }

    .description {
      color: #c4c9d2;
      line-height: 1.9;
      white-space: pre-wrap;
      margin-bottom: 25px;
    }

    .meta {
      display: grid;
      gap: 12px;
    }

    .meta-item {
      display: flex;
      justify-content: space-between;
      gap: 15px;

      padding: 13px;

      background: #20242a;
      border-radius: 10px;
    }

    .muted {
      color: #9da4af;
    }

    .value {
      font-weight: bold;
    }

    .blue {
      color: #4f8cff;
    }

    .btn {
      width: 100%;
      border: 0;
      border-radius: 11px;

      padding: 13px;

      cursor: pointer;

      font-size: 15px;
      font-weight: bold;

      margin-top: 10px;
    }

    .btn-primary {
      background: #4f8cff;
      color: white;
    }

    .btn-primary:hover {
      background: #3978e8;
    }

    .btn-danger {
      background: #8d3038;
      color: white;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #cdd2da;
    }

    input,
    textarea {
      width: 100%;

      background: #181b20;
      color: #e7eaf0;

      border: 1px solid #30363f;
      border-radius: 10px;

      padding: 12px;

      outline: none;

      font-size: 15px;
    }

    input:focus,
    textarea:focus {
      border-color: #4f8cff;
    }

    textarea {
      min-height: 130px;
      resize: vertical;
    }

    .message {
      display: none;

      padding: 12px;

      border-radius: 10px;

      margin-top: 12px;

      line-height: 1.6;
    }

    .success {
      display: block;

      background: #173b29;
      color: #82e5a9;
    }

    .error-message {
      display: block;

      background: #401f24;
      color: #ff9da7;
    }

    .section-title {
      font-size: 22px;
      margin-bottom: 18px;
    }

    .proposal {
      border: 1px solid #30363f;

      background: #20242a;

      border-radius: 14px;

      padding: 18px;

      margin-bottom: 14px;
    }

    .proposal-head {
      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      margin-bottom: 12px;
    }

    .proposal-name {
      font-weight: bold;
      font-size: 17px;
    }

    .proposal-message {
      color: #c4c9d2;

      line-height: 1.7;

      margin: 12px 0;

      white-space: pre-wrap;
    }

    .proposal-data {
      display: flex;

      flex-wrap: wrap;

      gap: 10px;
    }

    .badge {
      padding: 7px 10px;

      border-radius: 8px;

      background: #30363f;

      color: #e7eaf0;

      font-size: 13px;
    }

    .status-pending {
      color: #ffd36b;
    }

    .status-accepted {
      color: #70e5a0;
    }

    .status-rejected {
      color: #ff858f;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 800px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .title {
        font-size: 24px;
      }
    }
  </style>
</head>

<body>

<header class="header">

  <a href="index.html" class="logo">
    مِهراف
  </a>

  <a href="projects.html" class="back">
    العودة للمشاريع
  </a>

</header>


<main class="container">

  <div id="loading" class="loading">
    جاري تحميل المشروع...
  </div>


  <div id="errorBox" class="error hidden"></div>


  <div id="content" class="hidden">

    <div class="grid">

      <!-- تفاصيل المشروع -->

      <div>

        <div class="card">

          <h1 id="projectTitle" class="title"></h1>

          <div
            id="projectDescription"
            class="description">
          </div>


          <div class="meta">

            <div class="meta-item">

              <span class="muted">
                التصنيف
              </span>

              <span
                id="projectCategory"
                class="value">
              </span>

            </div>


            <div class="meta-item">

              <span class="muted">
                الميزانية
              </span>

              <span
                id="projectBudget"
                class="value blue">
              </span>

            </div>


            <div class="meta-item">

              <span class="muted">
                صاحب المشروع
              </span>

              <span
                id="projectOwner"
                class="value">
              </span>

            </div>


            <div class="meta-item">

              <span class="muted">
                الحالة
              </span>

              <span
                id="projectStatus"
                class="value">
              </span>

            </div>

          </div>

        </div>


        <!-- عروض صاحب المشروع -->

        <div
          id="proposalsCard"
          class="card hidden">

          <h2 class="section-title">
            العروض المقدمة
          </h2>

          <div id="proposalsList"></div>

        </div>

      </div>


      <!-- الجانب -->

      <aside>


        <!-- تقديم عرض -->

        <div
          id="applyCard"
          class="card hidden">

          <h2 class="section-title">
            قدم عرضك
          </h2>


          <form id="proposalForm">


            <div class="form-group">

              <label for="price">
                السعر
              </label>

              <input
                id="price"
                type="number"
                min="1"
                step="0.01"
                placeholder="مثال: 50"
                required>

            </div>


            <div class="form-group">

              <label for="deliveryDays">
                مدة التسليم بالأيام
              </label>

              <input
                id="deliveryDays"
                type="number"
                min="1"
                step="1"
                placeholder="مثال: 5"
                required>

            </div>


            <div class="form-group">

              <label for="message">
                رسالة العرض
              </label>

              <textarea
                id="message"
                placeholder="اكتب لصاحب المشروع لماذا أنت مناسب لتنفيذ المشروع..."
                required></textarea>

            </div>


            <button
              class="btn btn-primary"
              type="submit">

              إرسال العرض

            </button>


            <div
              id="formMessage"
              class="message">
            </div>

          </form>

        </div>


        <!-- صاحب المشروع -->

        <div
          id="ownerCard"
          class="card hidden">

          <h2 class="section-title">
            إدارة المشروع
          </h2>

          <p
            class="muted"
            style="line-height:1.8;">

            يمكنك من هنا مراجعة العروض المقدمة
            على مشروعك وقبول العرض المناسب.

          </p>

        </div>

      </aside>

    </div>

  </div>

</main>


<script>

  const params =
    new URLSearchParams(location.search);

  const projectId =
    Number(params.get("id"));


  const loading =
    document.getElementById("loading");

  const errorBox =
    document.getElementById("errorBox");

  const content =
    document.getElementById("content");


  const applyCard =
    document.getElementById("applyCard");

  const ownerCard =
    document.getElementById("ownerCard");

  const proposalsCard =
    document.getElementById("proposalsCard");


  let currentUser = null;

  let currentProject = null;



  function escapeHtml(value) {

    return String(value ?? "")
      .replaceAll("&", "&amp;")
      .replaceAll("<", "&lt;")
      .replaceAll(">", "&gt;")
      .replaceAll('"', "&quot;")
      .replaceAll("'", "&#039;");

  }



  function statusText(status) {

    const map = {

      open: "مفتوح",

      in_progress: "قيد التنفيذ",

      completed: "مكتمل",

      cancelled: "ملغي"

    };

    return map[status] || status;

  }



  function proposalStatusText(status) {

    const map = {

      pending: "قيد المراجعة",

      accepted: "مقبول",

      rejected: "مرفوض"

    };

    return map[status] || status;

  }



  async function load() {

    if (!projectId) {

      showError(
        "رقم المشروع غير صحيح"
      );

      return;

    }


    try {

      const meResponse =
        await fetch("/api/me", {

          credentials: "include",

          cache: "no-store"

        });


      const meData =
        await meResponse.json();


      if (
        !meData.success ||
        !meData.authenticated
      ) {

        location.href =
          "login.html";

        return;

      }


      currentUser =
        meData.user;


      const response =
        await fetch(
          `/api/projects/${projectId}`,
          {
            credentials: "include",
            cache: "no-store"
          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success
      ) {

        showError(
          data.error ||
          "تعذر تحميل المشروع"
        );

        return;

      }


      currentProject =
        data.project;


      document.getElementById(
        "projectTitle"
      ).textContent =
        currentProject.title;


      document.getElementById(
        "projectDescription"
      ).textContent =
        currentProject.description;


      document.getElementById(
        "projectCategory"
      ).textContent =
        currentProject.category;


      document.getElementById(
        "projectBudget"
      ).textContent =
        `${Number(
          currentProject.budget
        ).toLocaleString()} $`;


      document.getElementById(
        "projectOwner"
      ).textContent =
        currentProject.owner_name ||
        "غير معروف";


      document.getElementById(
        "projectStatus"
      ).textContent =
        statusText(
          currentProject.status
        );


      loading.classList.add(
        "hidden"
      );

      content.classList.remove(
        "hidden"
      );


      if (
        currentUser.role ===
          "freelancer" &&
        currentProject.can_apply
      ) {

        applyCard.classList.remove(
          "hidden"
        );

      }


      if (
        currentProject.is_owner
      ) {

        ownerCard.classList.remove(
          "hidden"
        );

        proposalsCard.classList.remove(
          "hidden"
        );

        await loadProposals();

      }

    } catch (error) {

      console.error(error);

      showError(
        "حدث خطأ أثناء تحميل المشروع"
      );

    }

  }



  async function loadProposals() {

    const list =
      document.getElementById(
        "proposalsList"
      );


    list.innerHTML =
      "جاري تحميل العروض...";


    try {

      const response =
        await fetch(
          `/api/projects/${projectId}/proposals`,
          {
            credentials: "include",
            cache: "no-store"
          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success
      ) {

        list.innerHTML = `
          <div class="error">
            ${escapeHtml(
              data.error ||
              "تعذر تحميل العروض"
            )}
          </div>
        `;

        return;

      }


      if (!data.proposals.length) {

        list.innerHTML = `
          <div class="muted">
            لا توجد عروض مقدمة على هذا المشروع حتى الآن.
          </div>
        `;

        return;

      }


      list.innerHTML =
        data.proposals
          .map(proposal => {


            const statusClass =
              proposal.status ===
                "accepted"

                ? "status-accepted"

                : proposal.status ===
                    "rejected"

                  ? "status-rejected"

                  : "status-pending";


            const buttons =
              proposal.status ===
                "pending" &&
              currentProject.status ===
                "open"

                ? `

                  <button
                    class="btn btn-primary"
                    onclick="changeProposalStatus(
                      ${proposal.id},
                      'accepted'
                    )">

                    قبول العرض

                  </button>


                  <button
                    class="btn btn-danger"
                    onclick="changeProposalStatus(
                      ${proposal.id},
                      'rejected'
                    )">

                    رفض العرض

                  </button>

                `

                : "";


            return `

              <div class="proposal">


                <div class="proposal-head">

                  <div class="proposal-name">

                    ${escapeHtml(
                      proposal.freelancer_name
                    )}

                  </div>


                  <div
                    class="${statusClass}">

                    ${escapeHtml(
                      proposalStatusText(
                        proposal.status
                      )
                    )}

                  </div>

                </div>


                <div class="proposal-data">

                  <span class="badge">

                    السعر:
                    ${Number(
                      proposal.price
                    ).toLocaleString()} $

                  </span>


                  <span class="badge">

                    التسليم:
                    ${Number(
                      proposal.delivery_days
                    )} يوم

                  </span>

                </div>


                <div class="proposal-message">

                  ${escapeHtml(
                    proposal.message
                  )}

                </div>


                ${buttons}

              </div>

            `;

          })
          .join("");


    } catch (error) {

      console.error(error);

      list.innerHTML = `
        <div class="error">
          حدث خطأ أثناء تحميل العروض
        </div>
      `;

    }

  }



  async function changeProposalStatus(
    proposalId,
    status
  ) {


    const text =
      status === "accepted"

        ? "هل تريد قبول هذا العرض؟ سيتم رفض باقي العروض ونقل المشروع إلى قيد التنفيذ."

        : "هل تريد رفض هذا العرض؟";


    if (!confirm(text)) {

      return;

    }


    try {

      const response =
        await fetch(
          `/api/proposals/${proposalId}/status`,
          {

            method: "POST",

            credentials: "include",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({
              status
            })

          }
        );


      const data =
        await response.json();


      if (
        !response.ok ||
        !data.success
      ) {

        alert(
          data.error ||
          "تعذر تحديث العرض"
        );

        return;

      }


      alert(
        data.message ||
        "تم تحديث العرض"
      );


      location.reload();


    } catch (error) {

      console.error(error);

      alert(
        "حدث خطأ أثناء تحديث العرض"
      );

    }

  }



  document
    .getElementById("proposalForm")
    .addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const formMessage =
          document.getElementById(
            "formMessage"
          );


        formMessage.className =
          "message";


        formMessage.textContent =
          "جاري إرسال العرض...";


        const price =
          Number(
            document.getElementById(
              "price"
            ).value
          );


        const deliveryDays =
          Number(
            document.getElementById(
              "deliveryDays"
            ).value
          );


        const message =
          document.getElementById(
            "message"
          ).value.trim();


        try {

          const response =
            await fetch(
              "/api/proposals",
              {

                method: "POST",

                credentials: "include",

                headers: {
                  "Content-Type":
                    "application/json"
                },

                body: JSON.stringify({

                  project_id:
                    projectId,

                  price,

                  delivery_days:
                    deliveryDays,

                  message

                })

              }
            );


          const data =
            await response.json();


          if (
            !response.ok ||
            !data.success
          ) {

            formMessage.className =
              "message error-message";


            formMessage.textContent =
              data.error ||
              "تعذر إرسال العرض";


            return;

          }


          formMessage.className =
            "message success";


          formMessage.textContent =
            "تم إرسال عرضك بنجاح";


          document
            .getElementById(
              "proposalForm"
            )
            .reset();


        } catch (error) {

          console.error(error);


          formMessage.className =
            "message error-message";


          formMessage.textContent =
            "حدث خطأ أثناء إرسال العرض";

        }

      }
    );



  function showError(message) {

    loading.classList.add(
      "hidden"
    );

    content.classList.add(
      "hidden"
    );


    errorBox.textContent =
      message;


    errorBox.classList.remove(
      "hidden"
    );

  }



  load();

</script>

</body>
</html>
