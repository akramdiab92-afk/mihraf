<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="تصفح المشاريع في مِهراف وابحث عن فرصة مناسبة لمهاراتك.">
  <title>تصفح المشاريع | مِهراف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --bg: #181b20;
      --bg-soft: #20242a;
      --card: #242930;
      --card-hover: #2a3038;
      --border: #30363f;
      --text: #e7eaf0;
      --muted: #9da4af;
      --blue: #4f8cff;
      --blue-dark: #3978e8;
      --white: #ffffff;
      --success: #35c759;
      --danger: #ff5c5c;

      --reserved: #aeb4bd;
      --reserved-bg: rgba(174, 180, 189, 0.12);

      --progress: #7f9fca;
      --progress-bg: rgba(127, 159, 202, 0.12);

      --completed: #35c759;
      --completed-bg: rgba(53, 199, 89, 0.12);
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.7;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: 0 auto;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(24, 27, 32, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(10px);
    }

    .header-inner {
      min-height: 70px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      font-size: 25px;
      font-weight: 800;
      color: var(--blue);
    }

    .back-link {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--muted);
      font-size: 14px;
      transition: 0.2s;
    }

    .back-link:hover {
      color: var(--white);
    }

    main {
      padding: 45px 0 70px;
    }

    .page-head {
      margin-bottom: 25px;
    }

    .page-head h1 {
      font-size: clamp(28px, 5vw, 38px);
      margin-bottom: 8px;
    }

    .page-head p {
      color: var(--muted);
      font-size: 16px;
    }

    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px;
      margin-bottom: 25px;
    }

    .filters {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .filter-btn {
      border: 1px solid var(--border);
      background: var(--card);
      color: var(--muted);
      padding: 9px 14px;
      border-radius: 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: 0.2s;
    }

    .filter-btn:hover {
      background: var(--card-hover);
      color: var(--text);
    }

    .filter-btn.active {
      background: var(--blue);
      border-color: var(--blue);
      color: var(--white);
    }

    .refresh-btn {
      border: 0;
      background: var(--blue);
      color: var(--white);
      padding: 10px 16px;
      border-radius: 9px;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      transition: 0.2s;
      white-space: nowrap;
    }

    .refresh-btn:hover {
      background: var(--blue-dark);
    }

    .refresh-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .projects-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 18px;
    }

    .project-card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 22px;
      transition: 0.2s;
      display: flex;
      flex-direction: column;
      min-height: 300px;
    }

    .project-card:hover {
      background: var(--card-hover);
      transform: translateY(-2px);
      border-color: #3d4652;
    }

    /* المشروع المحجوز */
    .project-card.reserved {
      opacity: 0.72;
      background: #202329;
      border-color: #343941;
    }

    .project-card.reserved:hover {
      opacity: 0.82;
      background: #24282e;
    }

    /* المشروع قيد التنفيذ */
    .project-card.in-progress {
      border-color: #394657;
    }

    /* المشروع المكتمل */
    .project-card.completed {
      border-color: #35453a;
    }

    .project-card.completed .details-btn {
      background: #3d6948;
    }

    .project-card.completed .details-btn:hover {
      background: #477b53;
    }

    .project-card h2 {
      font-size: 20px;
      margin-bottom: 10px;
      line-height: 1.5;
    }

    .description {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
      margin-bottom: 18px;
      white-space: pre-wrap;
      flex: 1;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 18px;
    }

    .meta-box {
      background: var(--bg-soft);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px;
    }

    .meta-label {
      display: block;
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 2px;
    }

    .meta-value {
      display: block;
      color: var(--text);
      font-size: 14px;
      font-weight: 700;
    }

    .project-footer {
      border-top: 1px solid var(--border);
      padding-top: 15px;
    }

    .owner {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 14px;
      font-size: 13px;
    }

    .owner-label {
      color: var(--muted);
    }

    .owner-name {
      color: var(--text);
      font-weight: 700;
    }

    .details-btn {
      display: block;
      width: 100%;
      text-align: center;
      background: var(--blue);
      color: var(--white);
      padding: 11px 15px;
      border-radius: 9px;
      font-size: 14px;
      font-weight: 700;
      transition: 0.2s;
    }

    .details-btn:hover {
      background: var(--blue-dark);
    }

    /* الحالات */

    .status {
      display: inline-flex;
      align-items: center;
      width: fit-content;
      font-size: 12px;
      padding: 4px 10px;
      border-radius: 20px;
      margin-bottom: 10px;
      font-weight: 700;
    }

    .status-open {
      background: rgba(53, 199, 89, 0.12);
      color: var(--success);
    }

    .status-reserved {
      background: var(--reserved-bg);
      color: var(--reserved);
    }

    .status-progress {
      background: var(--progress-bg);
      color: var(--progress);
    }

    .status-completed {
      background: var(--completed-bg);
      color: var(--completed);
    }

    .status-unknown {
      background: rgba(157, 164, 175, 0.12);
      color: var(--muted);
    }

    .loading,
    .empty,
    .error {
      text-align: center;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 35px 20px;
    }

    .loading {
      color: var(--muted);
    }

    .empty {
      color: var(--muted);
    }

    .error {
      color: var(--danger);
    }

    .error button {
      margin-top: 15px;
      border: 0;
      background: var(--blue);
      color: white;
      padding: 10px 18px;
      border-radius: 9px;
      cursor: pointer;
      font-family: inherit;
    }

    .hidden {
      display: none !important;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 25px 0;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .container {
        width: min(100% - 20px, 1100px);
      }

      main {
        padding-top: 30px;
      }

      .header-inner {
        min-height: 62px;
      }

      .logo {
        font-size: 22px;
      }

      .toolbar {
        align-items: stretch;
      }

      .refresh-btn {
        width: 100%;
      }

      .meta {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<header>
  <div class="container header-inner">
    <a href="index.html" class="logo">مِهراف</a>

    <a href="dashboard.html" class="back-link">
      ← العودة إلى لوحة التحكم
    </a>
  </div>
</header>

<main>
  <div class="container">

    <section class="page-head">
      <h1>تصفح المشاريع</h1>
      <p>اكتشف المشاريع وابحث عن فرصة مناسبة لمهاراتك.</p>
    </section>

    <section class="toolbar">
      <div class="filters">
        <button class="filter-btn active" data-category="all">
          جميع التصنيفات
        </button>

        <button class="filter-btn" data-category="التصميم">
          التصميم
        </button>

        <button class="filter-btn" data-category="البرمجة">
          البرمجة
        </button>

        <button class="filter-btn" data-category="الكتابة">
          الكتابة
        </button>

        <button class="filter-btn" data-category="التسويق">
          التسويق
        </button>

        <button class="filter-btn" data-category="الفيديو">
          الفيديو
        </button>

        <button class="filter-btn" data-category="الصوت">
          الصوت
        </button>

        <button class="filter-btn" data-category="الأعمال">
          الأعمال
        </button>

        <button class="filter-btn" data-category="أخرى">
          أخرى
        </button>
      </div>

      <button id="refreshBtn" class="refresh-btn">
        🔄 تحديث المشاريع
      </button>
    </section>

    <div id="loading" class="loading">
      جاري تحميل المشاريع...
    </div>

    <div id="error" class="error hidden">
      <div id="errorMessage">
        حدث خطأ أثناء تحميل المشاريع.
      </div>

      <button id="retryBtn">
        إعادة المحاولة
      </button>
    </div>

    <div id="empty" class="empty hidden">
      لا توجد مشاريع حاليا.
    </div>

    <section id="projectsGrid" class="projects-grid hidden"></section>

  </div>
</main>

<footer>
  <div class="container">
    مِهراف — منصة تجمع أصحاب المشاريع بالمستقلين والمحترفين
  </div>
</footer>

<script>
  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("error");
  const errorMessage = document.getElementById("errorMessage");
  const emptyBox = document.getElementById("empty");
  const projectsGrid = document.getElementById("projectsGrid");
  const refreshBtn = document.getElementById("refreshBtn");
  const retryBtn = document.getElementById("retryBtn");

  const filterButtons = document.querySelectorAll(".filter-btn");

  let allProjects = [];
  let currentCategory = "all";

  function escapeHTML(value) {
    const div = document.createElement("div");
    div.textContent = value == null ? "" : String(value);
    return div.innerHTML;
  }

  function formatBudget(value) {
    const number = Number(value);

    if (!Number.isFinite(number)) {
      return "$0.00";
    }

    return "$" + number.toFixed(2);
  }

  function formatDate(value) {
    if (!value) {
      return "غير محدد";
    }

    const date = new Date(String(value).replace(" ", "T"));

    if (Number.isNaN(date.getTime())) {
      return escapeHTML(value);
    }

    return date.toLocaleDateString("ar-EG", {
      year: "numeric",
      month: "long",
      day: "numeric"
    });
  }

  function getOwnerName(project) {
    return (
      project.owner_name ||
      project.full_name ||
      project.owner ||
      "مستخدم"
    );
  }

  /*
   * تحديد حالة المشروع
   *
   * نعتمد أولا على status القادمة من الـ Worker.
   * ونضع عدة احتمالات احتياطية حتى لا يظهر المشروع
   * على أنه مفتوح إذا كان هناك حجز أو تنفيذ.
   */
  function getProjectState(project) {
    const rawStatus = String(
      project.status ||
      project.project_status ||
      ""
    ).toLowerCase().trim();

    /*
     * المشروع المنجز
     */
    if (
      rawStatus === "completed" ||
      rawStatus === "complete" ||
      rawStatus === "done" ||
      rawStatus === "finished"
    ) {
      return {
        key: "completed",
        text: "تم إنجازه وتسليمه",
        className: "completed",
        statusClass: "status-completed"
      };
    }

    /*
     * المشروع قيد التنفيذ
     */
    if (
      rawStatus === "in_progress" ||
      rawStatus === "in-progress" ||
      rawStatus === "inprogress" ||
      rawStatus === "working"
    ) {
      return {
        key: "in_progress",
        text: "قيد التنفيذ",
        className: "in-progress",
        statusClass: "status-progress"
      };
    }

    /*
     * المشروع المحجوز
     */
    if (
      rawStatus === "reserved" ||
      rawStatus === "booked" ||
      rawStatus === "accepted"
    ) {
      return {
        key: "reserved",
        text: "محجوز",
        className: "reserved",
        statusClass: "status-reserved"
      };
    }

    /*
     * بعض الـ APIs قد ترجع معلومات الحجز
     * بدون تغيير status.
     */
    const hasAcceptedProposal =
      project.accepted_proposal_id ||
      project.acceptedProposalId ||
      project.accepted_proposal ||
      project.acceptedProposal ||
      project.execution_id ||
      project.executionId;

    if (hasAcceptedProposal) {
      return {
        key: "reserved",
        text: "محجوز",
        className: "reserved",
        statusClass: "status-reserved"
      };
    }

    /*
     * المشروع المفتوح
     */
    if (
      rawStatus === "open" ||
      rawStatus === "opened" ||
      rawStatus === ""
    ) {
      return {
        key: "open",
        text: "مفتوح",
        className: "",
        statusClass: "status-open"
      };
    }

    /*
     * أي حالة غير معروفة لا نظهرها كمفتوح
     */
    return {
      key: rawStatus,
      text: "غير متاح حاليا",
      className: "reserved",
      statusClass: "status-unknown"
    };
  }

  function showLoading() {
    loading.classList.remove("hidden");
    errorBox.classList.add("hidden");
    emptyBox.classList.add("hidden");
    projectsGrid.classList.add("hidden");
  }

  function showError(message) {
    loading.classList.add("hidden");
    projectsGrid.classList.add("hidden");
    emptyBox.classList.add("hidden");

    errorMessage.textContent =
      message || "حدث خطأ أثناء تحميل المشاريع.";

    errorBox.classList.remove("hidden");
  }

  function renderProjects() {
    projectsGrid.innerHTML = "";

    const filteredProjects =
      currentCategory === "all"
        ? allProjects
        : allProjects.filter(project =>
            String(project.category || "") === currentCategory
          );

    loading.classList.add("hidden");
    errorBox.classList.add("hidden");

    if (!filteredProjects.length) {
      projectsGrid.classList.add("hidden");
      emptyBox.classList.remove("hidden");
      return;
    }

    emptyBox.classList.add("hidden");
    projectsGrid.classList.remove("hidden");

    filteredProjects.forEach(project => {
      const id = Number(project.id);

      if (!Number.isFinite(id)) {
        return;
      }

      const state = getProjectState(project);

      const title = escapeHTML(
        project.title || "مشروع بدون عنوان"
      );

      const description = escapeHTML(
        project.description || "لا يوجد وصف للمشروع."
      );

      const category = escapeHTML(
        project.category || "أخرى"
      );

      const ownerName = escapeHTML(
        getOwnerName(project)
      );

      const budget = formatBudget(project.budget);
      const createdAt = formatDate(project.created_at);

      const card = document.createElement("article");

      card.className =
        "project-card " +
        state.className;

      /*
       * إذا كان المشروع محجوزا أو منجزا،
       * لا نستخدم زر أزرق يوحي بأنه مشروع مفتوح.
       */
      let detailsButtonText = "عرض تفاصيل المشروع";

      if (state.key === "reserved") {
        detailsButtonText = "عرض تفاصيل المشروع";
      }

      if (state.key === "in_progress") {
        detailsButtonText = "متابعة المشروع";
      }

      if (state.key === "completed") {
        detailsButtonText = "عرض المشروع المنجز";
      }

      card.innerHTML = `
        <span class="status ${state.statusClass}">
          ${escapeHTML(state.text)}
        </span>

        <h2>${title}</h2>

        <div class="description">
          ${description}
        </div>

        <div class="meta">
          <div class="meta-box">
            <span class="meta-label">التصنيف</span>
            <span class="meta-value">${category}</span>
          </div>

          <div class="meta-box">
            <span class="meta-label">الميزانية</span>
            <span class="meta-value">${budget}</span>
          </div>
        </div>

        <div class="project-footer">

          <div class="owner">
            <span class="owner-label">
              صاحب المشروع
            </span>

            <span class="owner-name">
              ${ownerName}
            </span>
          </div>

          <div class="owner">
            <span class="owner-label">
              تاريخ النشر
            </span>

            <span>
              ${createdAt}
            </span>
          </div>

          <a
            class="details-btn"
            href="project-details.html?id=${encodeURIComponent(id)}"
          >
            ${detailsButtonText}
          </a>

        </div>
      `;

      projectsGrid.appendChild(card);
    });
  }

  async function loadProjects() {
    showLoading();
    refreshBtn.disabled = true;

    try {
      const response = await fetch("/api/projects", {
        method: "GET",
        credentials: "include",
        cache: "no-store",
        headers: {
          "Accept": "application/json"
        }
      });

      const rawText = await response.text();

      let data;

      try {
        data = JSON.parse(rawText);
      } catch (parseError) {
        console.error(
          "Projects API returned invalid JSON:",
          rawText
        );

        throw new Error(
          "استجابة الخادم غير صالحة."
        );
      }

      console.log(
        "Projects API:",
        response.status,
        data
      );

      if (response.status === 401) {
        window.location.href = "login.html";
        return;
      }

      if (!response.ok || data.success !== true) {
        throw new Error(
          data.error ||
          data.message ||
          "تعذر تحميل المشاريع."
        );
      }

      allProjects = Array.isArray(data.projects)
        ? data.projects
        : [];

      console.log(
        "Projects with statuses:",
        allProjects.map(project => ({
          id: project.id,
          title: project.title,
          status: project.status,
          project_status: project.project_status,
          accepted_proposal_id:
            project.accepted_proposal_id,
          execution_id:
            project.execution_id
        }))
      );

      renderProjects();

    } catch (error) {
      console.error(
        "Error loading projects:",
        error
      );

      showError(
        error.message ||
        "حدث خطأ أثناء تحميل المشاريع. حاول مرة أخرى."
      );

    } finally {
      refreshBtn.disabled = false;
    }
  }

  filterButtons.forEach(button => {
    button.addEventListener("click", () => {

      filterButtons.forEach(btn =>
        btn.classList.remove("active")
      );

      button.classList.add("active");

      currentCategory =
        button.dataset.category || "all";

      renderProjects();
    });
  });

  refreshBtn.addEventListener(
    "click",
    loadProjects
  );

  retryBtn.addEventListener(
    "click",
    loadProjects
  );

  loadProjects();
</script>

</body>
</html>
