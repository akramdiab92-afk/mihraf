<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>مشاريعي | مِهراف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #181b20;
      color: #e7eaf0;
      min-height: 100vh;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .header {
      height: 68px;
      background: #20242a;
      border-bottom: 1px solid #30363f;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .logo {
      color: #4f8cff;
      font-size: 25px;
      font-weight: 800;
    }

    .back {
      background: #242930;
      border: 1px solid #30363f;
      padding: 10px 16px;
      border-radius: 10px;
    }

    .container {
      width: min(1100px, calc(100% - 30px));
      margin: 35px auto;
    }

    .page-title {
      font-size: 30px;
      margin-bottom: 10px;
    }

    .page-description {
      color: #9da4af;
      margin-bottom: 30px;
      line-height: 1.7;
    }

    .loading,
    .error,
    .empty {
      background: #242930;
      border: 1px solid #30363f;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
    }

    .error {
      color: #ff8d8d;
    }

    .empty {
      color: #9da4af;
    }

    .projects {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 20px;
    }

    .project-card {
      background: #242930;
      border: 1px solid #30363f;
      border-radius: 17px;
      padding: 22px;
      transition: 0.2s;
    }

    .project-card:hover {
      background: #2a3038;
      transform: translateY(-2px);
    }

    .project-title {
      font-size: 21px;
      font-weight: bold;
      margin-bottom: 12px;
    }

    .project-description {
      color: #b9c0ca;
      line-height: 1.7;
      margin-bottom: 18px;
    }

    .project-meta {
      display: grid;
      gap: 9px;
      margin-bottom: 18px;
    }

    .meta-row {
      display: flex;
      justify-content: space-between;
      gap: 15px;
      padding: 10px 12px;
      background: #20242a;
      border-radius: 9px;
    }

    .muted {
      color: #9da4af;
    }

    .budget {
      color: #4f8cff;
      font-weight: bold;
    }

    .status {
      color: #70e5a0;
      font-weight: bold;
    }

    .details-btn {
      display: block;
      width: 100%;
      background: #4f8cff;
      color: #fff;
      text-align: center;
      border-radius: 10px;
      padding: 12px;
      font-weight: bold;
      transition: 0.2s;
    }

    .details-btn:hover {
      background: #3978e8;
    }

    .retry-btn {
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #4f8cff;
      color: white;
      padding: 11px 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .hidden {
      display: none !important;
    }

    @media (max-width: 750px) {
      .projects {
        grid-template-columns: 1fr;
      }

      .page-title {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <a href="index.html" class="logo">مِهراف</a>

  <a href="index.html" class="back">
    العودة للرئيسية
  </a>
</header>

<main class="container">

  <h1 class="page-title">
    مشاريعي
  </h1>

  <p class="page-description">
    إدارة المشاريع التي قمت بنشرها على منصة مهراف.
  </p>

  <div id="loading" class="loading">
    جاري تحميل المشاريع...
  </div>

  <div id="errorBox" class="error hidden">
    <div id="errorText"></div>

    <button id="retryBtn" class="retry-btn">
      حاول مرة أخرى
    </button>
  </div>

  <div id="emptyBox" class="empty hidden">
    لا يوجد لديك مشاريع منشورة حتى الآن.
  </div>

  <div id="projects" class="projects hidden"></div>

</main>

<script>
  const loading = document.getElementById("loading");
  const errorBox = document.getElementById("errorBox");
  const errorText = document.getElementById("errorText");
  const emptyBox = document.getElementById("emptyBox");
  const projectsBox = document.getElementById("projects");
  const retryBtn = document.getElementById("retryBtn");

  function escapeHtml(value) {
    return String(value ?? "")
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function statusText(status) {
    const statuses = {
      open: "مفتوح",
      in_progress: "قيد التنفيذ",
      completed: "مكتمل",
      cancelled: "ملغي"
    };

    return statuses[status] || status || "غير محدد";
  }

  function showLoading() {
    loading.classList.remove("hidden");
    errorBox.classList.add("hidden");
    emptyBox.classList.add("hidden");
    projectsBox.classList.add("hidden");
  }

  function showError(message) {
    loading.classList.add("hidden");
    emptyBox.classList.add("hidden");
    projectsBox.classList.add("hidden");

    errorText.textContent =
      message || "حدث خطأ أثناء تحميل المشاريع.";

    errorBox.classList.remove("hidden");
  }

  async function loadProjects() {

    showLoading();

    try {

      const response = await fetch(
        "/api/projects",
        {
          method: "GET",
          credentials: "include",
          cache: "no-store",
          headers: {
            "Accept": "application/json"
          }
        }
      );

      const rawText = await response.text();

      let data;

      try {
        data = JSON.parse(rawText);
      } catch (jsonError) {

        console.error("Invalid JSON:", rawText);

        showError(
          "الخادم أرسل استجابة غير صالحة."
        );

        return;
      }

      console.log("Projects API:", data);

      if (response.status === 401) {
        window.location.href = "login.html";
        return;
      }

      if (!response.ok || data.success !== true) {

        showError(
          data.error ||
          data.message ||
          "حدث خطأ أثناء تحميل المشاريع."
        );

        return;
      }

      const projects = Array.isArray(data.projects)
        ? data.projects
        : [];

      loading.classList.add("hidden");

      if (projects.length === 0) {

        emptyBox.classList.remove("hidden");

        return;
      }

      projectsBox.innerHTML = projects.map(project => {

        const id = encodeURIComponent(project.id);

        return `
          <article class="project-card">

            <h2 class="project-title">
              ${escapeHtml(project.title)}
            </h2>

            <div class="project-description">
              ${escapeHtml(project.description)}
            </div>

            <div class="project-meta">

              <div class="meta-row">
                <span class="muted">
                  التصنيف
                </span>

                <span>
                  ${escapeHtml(project.category)}
                </span>
              </div>

              <div class="meta-row">
                <span class="muted">
                  الميزانية
                </span>

                <span class="budget">
                  ${Number(project.budget || 0).toLocaleString()} $
                </span>
              </div>

              <div class="meta-row">
                <span class="muted">
                  الحالة
                </span>

                <span class="status">
                  ${escapeHtml(statusText(project.status))}
                </span>
              </div>

            </div>

            <a
              class="details-btn"
              href="project.html?id=${id}">
              تفاصيل المشروع
            </a>

          </article>
        `;
      }).join("");

      projectsBox.classList.remove("hidden");

    } catch (error) {

      console.error("Projects loading error:", error);

      showError(
        "تعذر الاتصال بالخادم. حاول مرة أخرى."
      );
    }
  }

  retryBtn.addEventListener(
    "click",
    loadProjects
  );

  loadProjects();
</script>

</body>
</html>
