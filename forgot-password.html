<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>نسيت كلمة المرور | مِهراف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Tahoma, Arial, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .header {
      background: #fff;
      border-bottom: 1px solid #e5e7eb;
    }

    .header-inner {
      max-width: 1100px;
      margin: auto;
      min-height: 70px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      color: #2563eb;
      text-decoration: none;
    }

    .home-link {
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      margin: auto;
      padding: 35px 20px;
    }

    .box {
      background: #fff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 5px 20px rgba(0,0,0,.04);
    }

    h1 {
      font-size: 25px;
      color: #111827;
      margin-bottom: 12px;
    }

    .description {
      color: #6b7280;
      line-height: 1.8;
      font-size: 14px;
      margin-bottom: 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      color: #374151;
      margin-bottom: 8px;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 9px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
      direction: ltr;
      text-align: left;
    }

    input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #dbeafe;
    }

    button {
      width: 100%;
      margin-top: 15px;
      border: none;
      background: #2563eb;
      color: #fff;
      padding: 13px;
      border-radius: 9px;
      font-family: inherit;
      font-size: 15px;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    button:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 18px;
      padding: 13px;
      border-radius: 9px;
      line-height: 1.8;
      font-size: 13px;
    }

    .success {
      display: block;
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      color: #166534;
    }

    .error {
      display: block;
      background: #fff1f2;
      border: 1px solid #fecdd3;
      color: #be123c;
    }

    .back {
      display: block;
      text-align: center;
      margin-top: 20px;
      color: #2563eb;
      text-decoration: none;
      font-size: 14px;
    }

    .footer {
      border-top: 1px solid #e5e7eb;
      background: #fff;
      text-align: center;
      padding: 22px;
      color: #6b7280;
      font-size: 13px;
    }

    @media (max-width: 600px) {
      .box {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

<header class="header">
  <div class="header-inner">
    <a href="index.html" class="logo">مِهراف</a>
    <a href="index.html" class="home-link">الرئيسية</a>
  </div>
</header>

<main class="container">

  <div class="box">

    <h1>نسيت كلمة المرور؟</h1>

    <p class="description">
      أدخل البريد الإلكتروني المرتبط بحسابك،
      وسنرسل لك رابطا لإعادة تعيين كلمة المرور.
    </p>

    <form id="forgotForm">

      <label for="email">
        البريد الإلكتروني
      </label>

      <input
        id="email"
        type="email"
        autocomplete="email"
        placeholder="example@email.com"
        required
      >

      <button
        id="submitButton"
        type="submit"
      >
        إرسال رابط إعادة التعيين
      </button>

    </form>

    <div id="message" class="message"></div>

    <a href="login.html" class="back">
      العودة إلى تسجيل الدخول
    </a>

  </div>

</main>

<footer class="footer">
  © 2026 مِهراف | MIHRAF - منصة الخدمات والمشاريع
</footer>

<script>

  const form =
    document.getElementById("forgotForm");

  const emailInput =
    document.getElementById("email");

  const submitButton =
    document.getElementById("submitButton");

  const message =
    document.getElementById("message");

  form.addEventListener("submit", async function(event) {

    event.preventDefault();

    const email =
      emailInput.value.trim();

    if (!email) {
      showMessage(
        "يرجى إدخال البريد الإلكتروني.",
        false
      );
      return;
    }

    submitButton.disabled = true;

    submitButton.textContent =
      "جاري إرسال الرابط...";

    message.className = "message";
    message.textContent = "";

    try {

      const response =
        await fetch(
          "/api/forgot-password",
          {
            method: "POST",

            headers: {
              "Content-Type":
                "application/json",

              "Accept":
                "application/json"
            },

            body: JSON.stringify({
              email: email
            })
          }
        );

      const data =
        await response.json();

      if (!response.ok || !data.success) {
        throw new Error(
          data.error ||
          "حدث خطأ أثناء إرسال الطلب."
        );
      }

      showMessage(
        data.message ||
        "إذا كان البريد مسجلا لدينا، ستصلك رسالة لإعادة تعيين كلمة المرور.",
        true
      );

      form.reset();

    } catch (error) {

      console.error(
        "Forgot password:",
        error
      );

      showMessage(
        error.message ||
        "حدث خطأ أثناء إرسال الطلب.",
        false
      );

    } finally {

      submitButton.disabled = false;

      submitButton.textContent =
        "إرسال رابط إعادة التعيين";

    }

  });

  function showMessage(text, success) {

    message.textContent = text;

    message.className =
      success
        ? "message success"
        : "message error";

  }

</script>

</body>
</html>
