<!DOCTYPE html><html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تصفح الأعمال | مِهراف</title>  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: #f5f7fb;
      color: #1f2937;
      min-height: 100vh;
    }

    header {
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      padding: 16px 20px;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    .header-inner {
      max-width: 1200px;
      margin: auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .logo {
      color: #2563eb;
      font-size: 25px;
      font-weight: 800;
      text-decoration: none;
    }

    .back-btn {
      text-decoration: none;
      color: #374151;
      background: #f3f4f6;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 600;
    }

    .hero {
      max-width: 1200px;
      margin: 35px auto 20px;
      padding: 0 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      margin-bottom: 10px;
      color: #111827;
    }

    .hero p {
      color: #6b7280;
      font-size: 16px;
    }

    .filters {
      max-width: 1200px;
      margin: 25px auto;
      padding: 0 20px;
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .filter {
      border: 1px solid #d1d5db;
      background: white;
      color: #374151;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-size: 14px;
    }

    .filter.active {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .container {
      max-width: 1200px;
      margin: auto;
      padding: 0 20px 50px;
    }

    .status {
      text-align: center;
      padding: 40px 15px;
      color: #6b7280;
    }

    .error {
      color: #b91c1c;
      background: #fee2e2;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .portfolio-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 22px;
    }

    .card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 15px rgba(0,0,0,.05);
      transition: transform .2s, box-shadow .2s;
    }

    .card:hover {
      transform: translateY(-4px);
      box-shadow: 0 10px 25px rgba(0,0,0,.09);
    }

    .image {
      width: 100%;
      height: 210px;
      background: #eef2f7;
      object-fit: cover;
      display: block;
    }

    .no-image {
      height: 210px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #eff6ff, #f3f4f6);
      color: #9ca3af;
      font-size: 45px;
    }

    .card-body {
      padding: 18px;
    }

    .category {
      display: inline-block;
      background: #eff6ff;
      color: #2563eb;
      padding: 5px 9px;
      border-radius: 7px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .card h2 {
      font-size: 19px;
      margin-bottom: 9px;
      color: #111827;
    }

    .description {
      color: #6b7280;
      line-height: 1.7;
      font-size: 14px;
      min-height: 48px;
    }

    .owner {
      margin-top: 15px;
      padding-top: 13px;
      border-top: 1px solid #eee;
      color: #4b5563;
      font-size: 14px;
    }

    .visit {
      display: block;
      text-align: center;
      margin-top: 14px;
      padding: 10px;
      border-radius: 9px;
      background: #2563eb;
      color: white;
      text-decoration: none;
      font-weight: 600;
    }

    .visit:hover {
      background: #1d4ed8;
    }

    @media (max-width: 900px) {
      .portfolio-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 600px) {
      .portfolio-grid {
        grid-template-columns: 1fr;
      }

      .hero h1 {
        font-size: 26px;
      }

      .image,
      .no-image {
        height: 190px;
      }
    }
  </style></head><body><header>
  <div class="header-inner">
    <a href="index.html" class="logo">مِهراف</a>
    <a href="index.html" class="back-btn">العودة للرئيسية</a>
  </div>
</header><section class="hero">
  <h1>تصفح الأعمال</h1>
  <p>اكتشف نماذج وأعمال المنفذين المميزين على منصة مِهراف</p>
</section><div class="filters" id="filters">
  <button class="filter active" data-category="all">كل الأعمال</button>
</div><main class="container">
  <div id="status" class="status">جاري تحميل الأعمال...</div>
  <div id="portfolioGrid" class="portfolio-grid"></div>
</main><script>
  const statusBox = document.getElementById("status");
  const portfolioGrid = document.getElementById("portfolioGrid");
  const filtersBox = document.getElementById("filters");

  let allItems = [];

  async function loadPortfolio() {
    statusBox.style.display = "block";
    statusBox.textContent = "جاري تحميل الأعمال...";
    portfolioGrid.innerHTML = "";

    try {
      const response = await fetch("/api/portfolio", {
        method: "GET",
        credentials: "include"
      });

      const data = await response.json().catch(() => null);

      if (!response.ok || !data || data.success !== true) {
        throw new Error(
          data?.error ||
          data?.details ||
          "تعذر تحميل الأعمال"
        );
      }

      allItems = Array.isArray(data.items) ? data.items : [];

      buildFilters();

      if (allItems.length === 0) {
        statusBox.style.display = "block";
        statusBox.textContent = "لا توجد أعمال منشورة حاليا.";
        return;
      }

      statusBox.style.display = "none";
      renderItems(allItems);

    } catch (error) {
      console.error("Portfolio error:", error);

      statusBox.className = "status error";
      statusBox.style.display = "block";
      statusBox.textContent =
        error.message || "حدث خطأ أثناء تحميل الأعمال.";
    }
  }

  function buildFilters() {
    const categories = [
      ...new Set(
        allItems
          .map(item => item.category)
          .filter(Boolean)
      )
    ];

    filtersBox.innerHTML = "";

    const allButton = document.createElement("button");
    allButton.className = "filter active";
    allButton.dataset.category = "all";
    allButton.textContent = "كل الأعمال";

    allButton.onclick = () => {
      setActiveFilter(allButton);
      renderItems(allItems);
    };

    filtersBox.appendChild(allButton);

    categories.forEach(category => {
      const button = document.createElement("button");

      button.className = "filter";
      button.dataset.category = category;
      button.textContent = category;

      button.onclick = () => {
        setActiveFilter(button);

        const filtered = allItems.filter(
          item => item.category === category
        );

        renderItems(filtered);
      };

      filtersBox.appendChild(button);
    });
  }

  function setActiveFilter(activeButton) {
    document.querySelectorAll(".filter").forEach(button => {
      button.classList.remove("active");
    });

    activeButton.classList.add("active");
  }

  function renderItems(items) {
    portfolioGrid.innerHTML = "";

    if (!items.length) {
      statusBox.style.display = "block";
      statusBox.className = "status";
      statusBox.textContent = "لا توجد أعمال ضمن هذا التصنيف.";
      return;
    }

    statusBox.style.display = "none";

    items.forEach(item => {
      const card = document.createElement("article");
      card.className = "card";

      const imagePart = item.image_url
        ? `
          <img
            class="image"
            src="${escapeAttribute(item.image_url)}"
            alt="${escapeAttribute(item.title || "عمل")}
            loading="lazy"
            onerror="this.outerHTML='<div class=&quot;no-image&quot;>🎨</div>'"
          >
        `
        : `<div class="no-image">🎨</div>`;

      const visitButton = item.project_url
        ? `
          <a
            class="visit"
            href="${escapeAttribute(item.project_url)}"
            target="_blank"
            rel="noopener noreferrer"
          >
            مشاهدة العمل
          </a>
        `
        : "";

      card.innerHTML = `
        ${imagePart}

        <div class="card-body">
          ${
            item.category
              ? `<span class="category">${escapeHtml(item.category)}</span>`
              : ""
          }

          <h2>${escapeHtml(item.title || "عمل بدون عنوان")}</h2>

          <div class="description">
            ${escapeHtml(item.description || "لا يوجد وصف للعمل.")}
          </div>

          <div class="owner">
            المنفذ: <strong>${escapeHtml(item.user_name || "منفذ على مِهراف")}</strong>
          </div>

          ${visitButton}
        </div>
      `;

      portfolioGrid.appendChild(card);
    });
  }

  function escapeHtml(value) {
    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");
  }

  function escapeAttribute(value) {
    return escapeHtml(value);
  }

  loadPortfolio();
</script></body>
</html>
