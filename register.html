<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>إنشاء حساب | مِهراف</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, Tahoma, sans-serif;
      background: linear-gradient(135deg, #667eea, #764ba2);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 460px;
      background: #fff;
      border-radius: 18px;
      padding: 35px 30px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.2);
    }

    .logo {
      text-align: center;
      margin-bottom: 10px;
      font-size: 32px;
      font-weight: bold;
      color: #667eea;
    }

    .subtitle {
      text-align: center;
      color: #777;
      margin-bottom: 30px;
      font-size: 15px;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-weight: bold;
      color: #333;
    }

    input,
    select {
      width: 100%;
      padding: 13px 14px;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
      background: #fff;
    }

    input:focus,
    select:focus {
      border-color: #667eea;
      box-shadow: 0 0 0 3px rgba(102,126,234,0.12);
    }

    .terms {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 18px 0;
      font-size: 13px;
      color: #666;
    }

    .terms input {
      width: auto;
      margin-top: 3px;
    }

    .terms a {
      color: #667eea;
      text-decoration: none;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 10px;
      padding: 14px;
      background: linear-gradient(135deg, #667eea, #764ba2);
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 8px 20px rgba(102,126,234,0.25);
    }

    button:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .message {
      display: none;
      margin-bottom: 18px;
      padding: 14px;
      border-radius: 10px;
      font-size: 14px;
      line-height: 1.7;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .message.error {
      display: block;
      background: #fff0f0;
      border: 1px solid #ffbcbc;
      color: #b42318;
    }

    .message.success {
      display: block;
      background: #effcf3;
      border: 1px solid #a6e3b5;
      color: #18743a;
    }

    .login-link {
      text-align: center;
      margin-top: 22px;
      color: #666;
      font-size: 14px;
    }

    .login-link a {
      color: #667eea;
      font-weight: bold;
      text-decoration: none;
    }

    .debug-title {
      font-weight: bold;
      margin-bottom: 5px;
    }

    .debug-details {
      direction: ltr;
      text-align: left;
      background: rgba(0,0,0,0.04);
      padding: 8px;
      border-radius: 6px;
      margin-top: 8px;
      font-family: monospace;
      font-size: 12px;
      overflow-x: auto;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">مِهراف</div>

    <div class="subtitle">
      أنشئ حسابك وابدأ العمل على منصة مِهراف
    </div>

    <div id="message" class="message"></div>

    <form id="registerForm">

      <div class="form-group">
        <label for="full_name">الاسم الكامل</label>
        <input
          type="text"
          id="full_name"
          name="full_name"
          placeholder="أدخل اسمك الكامل"
          autocomplete="name"
          required
        >
      </div>

      <div class="form-group">
        <label for="email">البريد الإلكتروني</label>
        <input
          type="email"
          id="email"
          name="email"
          placeholder="example@email.com"
          autocomplete="email"
          required
        >
      </div>

      <div class="form-group">
        <label for="password">كلمة المرور</label>
        <input
          type="password"
          id="password"
          name="password"
          placeholder="أدخل كلمة المرور"
          autocomplete="new-password"
          minlength="6"
          required
        >
      </div>

      <div class="form-group">
        <label for="confirm_password">تأكيد كلمة المرور</label>
        <input
          type="password"
          id="confirm_password"
          name="confirm_password"
          placeholder="أعد كتابة كلمة المرور"
          autocomplete="new-password"
          minlength="6"
          required
        >
      </div>

      <!-- نوع الحساب مخفي للتوافق مع النظام الحالي -->
      <input
        type="hidden"
        name="role"
        value="client"
      >

      <div class="terms">
        <input type="checkbox" id="terms" required>

        <label for="terms">
          أوافق على شروط استخدام منصة مِهراف
        </label>
      </div>

      <button type="submit" id="registerButton">
        إنشاء الحساب
      </button>

    </form>

    <div class="login-link">
      لديك حساب بالفعل؟
      <a href="login.html">تسجيل الدخول</a>
    </div>

  </div>

  <script>
    const form = document.getElementById("registerForm");
    const button = document.getElementById("registerButton");
    const messageBox = document.getElementById("message");

    function showMessage(text, type = "error") {
      messageBox.className = "message " + type;
      messageBox.innerHTML = text;
      messageBox.style.display = "block";
    }

    function escapeHtml(value) {
      return String(value ?? "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    form.addEventListener("submit", async function(event) {
      event.preventDefault();

      messageBox.style.display = "none";

      const full_name = document.getElementById("full_name").value.trim();
      const email = document.getElementById("email").value.trim().toLowerCase();
      const password = document.getElementById("password").value;
      const confirm_password = document.getElementById("confirm_password").value;

      // حساب موحد: نرسل قيمة متوافقة مع قاعدة البيانات الحالية
      const role = "client";

      if (!full_name) {
        showMessage("يرجى إدخال الاسم الكامل.");
        return;
      }

      if (!email) {
        showMessage("يرجى إدخال البريد الإلكتروني.");
        return;
      }

      if (password.length < 6) {
        showMessage("كلمة المرور يجب أن تكون 6 أحرف على الأقل.");
        return;
      }

      if (password !== confirm_password) {
        showMessage("كلمتا المرور غير متطابقتين.");
        return;
      }

      button.disabled = true;
      button.textContent = "جار إنشاء الحساب...";

      try {
        const response = await fetch("/api/register", {
          method: "POST",
          credentials: "include",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            full_name,
            email,
            password,
            role
          })
        });

        let result = {};

        try {
          result = await response.json();
        } catch (jsonError) {
          const rawText = await response.text().catch(() => "");
          result = {
            error: "الخادم لم يرجع استجابة JSON صحيحة.",
            details: rawText || "لا توجد تفاصيل إضافية."
          };
        }

        console.log("REGISTER STATUS:", response.status);
        console.log("REGISTER RESPONSE:", result);

        if (!response.ok || result.success === false) {

          const errorMessage =
            result.error ||
            result.message ||
            "حدث خطأ غير معروف أثناء إنشاء الحساب.";

          const details =
            result.details ||
            result.detail ||
            "";

          let html =
            "<div class='debug-title'>" +
            escapeHtml(errorMessage) +
            "</div>";

          html +=
            "<div>رمز HTTP: " +
            escapeHtml(response.status) +
            "</div>";

          if (details) {
            html +=
              "<div class='debug-details'>" +
              escapeHtml(details) +
              "</div>";
          }

          showMessage(html, "error");

          return;
        }

        showMessage(
          escapeHtml(
            result.message ||
            "تم إنشاء الحساب بنجاح. سيتم تحويلك إلى صفحة تسجيل الدخول..."
          ),
          "success"
        );

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1000);

      } catch (error) {

        console.error("REGISTER FETCH ERROR:", error);

        showMessage(
          "<div class='debug-title'>تعذر الاتصال بالخادم</div>" +
          "<div class='debug-details'>" +
          escapeHtml(error?.message || error) +
          "</div>",
          "error"
        );

      } finally {
        button.disabled = false;
        button.textContent = "إنشاء الحساب";
      }
    });
  </script>

</body>
</html>
